# これは Git の pre-commit フックを管理する仕組みであり、`git commit --no-verify` で回避できる。
# したがってここは強制力ではなく早期検知の位置づけで、強制は CI（.github/workflows/）が担う。
#
# それでもローカルに置くのは、秘密情報は一度コミットされると履歴から実質的に消せないため。
# CI が気づくのは「履歴に入った後」であり、公開リポジトリでは手遅れになる。
#
# 利用開始時は各クローンで一度だけ実行が必要:
#   pre-commit install

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # Keep this rev in step with the ruff version pinned in
  # .github/workflows/python.yml, or a commit that passes here can still fail CI.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1
    hooks:
      # Fix locally, where the result can be reviewed before committing. CI runs
      # the same check without --fix, so an unfixed commit is still caught.
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
