name: python

on:
  # Limiting push to main avoids running twice for a pull request opened from a
  # branch in this same repository.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Without an explicit version the action installs the latest release, so a
      # ruff release on its own could fail this job. Pin it, and keep the value in
      # step with the rev in .pre-commit-config.yaml so local runs agree with CI.
      - uses: astral-sh/ruff-action@v4
        with:
          version: "0.16.1"

      # The action defaults to "check", so the format check needs its own step.
      # --diff prints the reformatting inline, making a failure readable from the log.
      - uses: astral-sh/ruff-action@v4
        with:
          version: "0.16.1"
          args: "format --check --diff"
