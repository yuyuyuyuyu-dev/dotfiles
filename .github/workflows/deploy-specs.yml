name: deploy specs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: should deploy to ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: mac
            name: macOS
            runner: macos-latest
            links: >-
              .bash_profile .bashrc
              .zshrc .zprofile .zshenv .zlogout
              .vimrc .ideavimrc .tmux.conf
              .claude/CLAUDE.md .gemini/GEMINI.md
              .config
          - platform: linux
            name: Linux
            runner: ubuntu-latest
            links: >-
              .bash_profile .bashrc
              .zshrc .zprofile .zshenv .zlogout
              .vimrc
              .config
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: "25"

      - run: |
          curl -fsSL https://raw.githubusercontent.com/yuyuyuyuyu-dev/kotlinstall/main/install-kotlinstall.main.kts | kotlinr -howtorun .main.kts /dev/stdin
          echo "${HOME}/.kotlinstall/bin" >> "${GITHUB_PATH}"

      - run: |
          mkdir -p "${RUNNER_TEMP}/home"
          HOME="${RUNNER_TEMP}/home" python3 -m deploy ${{ matrix.platform }} < /dev/null

      - name: assert every configuration file resolves to the one in this checkout
        run: |
          for link in ${{ matrix.links }}; do
            deployed=$(readlink -f "${RUNNER_TEMP}/home/$link")
            source=$(readlink -f "${GITHUB_WORKSPACE}/$link")
            test "$deployed" = "$source" || {
              echo "::error::$link resolves to '$deployed', expected '$source'"
              exit 1
            }
          done

      # git falls back to writing ~/.config/git/config when ~/.gitconfig is
      # absent, and ~/.config is a link into the checkout, so the deployment
      # would be editing its own source.
      - name: assert git settings stayed out of the linked config directory
        run: |
          test -f "${RUNNER_TEMP}/home/.gitconfig" || {
            echo "::error::~/.gitconfig was not created"; exit 1; }
          git -C "${GITHUB_WORKSPACE}" diff --quiet -- .config || {
            echo "::error::the deployment modified its own source"; exit 1; }

      - name: assert the deployment installed claude-gh-admission-hook
        env:
          PAYLOAD: '{"tool_name":"Bash","tool_input":{"command":"gh issue create --title \"Checking that claude-gh-admission-hook was installed correctly\""}}'
        run: |
          echo "$PAYLOAD" \
            | "${RUNNER_TEMP}/home/.kotlinstall/bin/claude-gh-admission-hook" \
            | grep '"permissionDecision":"deny"'

  unnecessary-changes:
    name: should change nothing but the files it deploys
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: assert the deployment created nothing else
        uses: yuyuyuyuyu-dev/assert-no-unexpected-changes@v1
        with:
          arrange: apt-get update && apt-get install --yes --no-install-recommends python3 git
          act: mkdir /home/fresh && HOME=/home/fresh python3 -m deploy linux
          allowlist: |
            /home/fresh/.bash_profile
            /home/fresh/.bashrc
            /home/fresh/.zshrc
            /home/fresh/.zprofile
            /home/fresh/.zshenv
            /home/fresh/.zlogout
            /home/fresh/.vimrc
            /home/fresh/.config
            /home/fresh/.gitconfig
