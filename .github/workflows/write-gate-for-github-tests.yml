name: write-gate-for-github tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  read-only:
    name: should restrict GitHub access to read-only permission
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - run: cargo build --release --locked
        working-directory: write-gate-for-github

      - uses: ./.github/actions/write-gate-for-github-read-only
        with:
          guard: ${{ github.workspace }}/write-gate-for-github/target/release/write-gate-for-github

  pull-request-create:
    name: should ask before creating a pull request, as an exception
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - run: cargo build --release --locked
        working-directory: write-gate-for-github

      - uses: ./.github/actions/write-gate-for-github-pull-request-create
        with:
          guard: ${{ github.workspace }}/write-gate-for-github/target/release/write-gate-for-github

  pull-request-edit:
    name: should ask before editing a pull request, as an exception
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - run: cargo build --release --locked
        working-directory: write-gate-for-github

      - uses: ./.github/actions/write-gate-for-github-pull-request-edit
        with:
          guard: ${{ github.workspace }}/write-gate-for-github/target/release/write-gate-for-github

  actionable-denial:
    name: should explain a denial well enough for Claude to act on it
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - run: cargo build --release --locked
        working-directory: write-gate-for-github

      - uses: ./.github/actions/write-gate-for-github-actionable-denial
        with:
          guard: ${{ github.workspace }}/write-gate-for-github/target/release/write-gate-for-github
