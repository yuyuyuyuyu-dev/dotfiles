name: ruff

on:
  # Limiting push to main avoids running twice for a pull request opened from a
  # branch in this same repository.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# The two checks are separate jobs so that both always report. Run as steps in one
# job, a lint failure would stop the job before the format check ran, and the
# formatting problems would only surface on the next push.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Astral publishes no floating tag for this action's newest major, so the
      # exact version is required -- @v9 does not resolve.
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      # ruff runs through uv, so its version comes from uv.lock -- the same file
      # that decides the version locally. --frozen fails instead of quietly
      # resolving something else when the lockfile is behind pyproject.toml.
      - run: uv sync --frozen --only-dev

      - run: uv run --frozen ruff check .

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - run: uv sync --frozen --only-dev

      # --diff prints the reformatting inline, making a failure readable from the log.
      - run: uv run --frozen ruff format --check --diff .
