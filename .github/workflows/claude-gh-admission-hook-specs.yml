name: claude-gh-admission-hook specs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  installable:
    name: should be installable
    runs-on: macos-latest
    steps:
      # Act
      - run: cargo install --git "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" --rev "$GITHUB_SHA" --locked claude-gh-admission-hook

      # Assert
      - env:
          PAYLOAD: '{"tool_name":"Bash","tool_input":{"command":"gh issue create --title x"}}'
        run: echo "$PAYLOAD" | "$HOME/.cargo/bin/claude-gh-admission-hook" | grep '"permissionDecision":"deny"'

  read-only:
    name: should restrict GitHub access to read-only permission
    runs-on: macos-latest
    steps:
      # Arrange
      - &check-out
        uses: actions/checkout@v7

      - &build
        run: cargo build --release --locked
        working-directory: claude-gh-admission-hook

      # Act & Assert
      - uses: ./.github/actions/claude-gh-admission-hook-specs/read-only
        with:
          guard: ${{ github.workspace }}/claude-gh-admission-hook/target/release/claude-gh-admission-hook

  pull-request-create:
    name: should ask before creating a draft pull request, as an exception
    runs-on: macos-latest
    steps:
      # Arrange
      - *check-out

      - *build

      # Act
      - env:
          PAYLOAD: '{"tool_name":"Bash","tool_input":{"command":"gh pr create --draft --title x --body y"}}'
        run: echo "$PAYLOAD" | claude-gh-admission-hook/target/release/claude-gh-admission-hook > "$RUNNER_TEMP/decision"

      # Assert
      - run: grep '"permissionDecision":"ask"' "$RUNNER_TEMP/decision"

  pull-request-edit:
    name: should ask before editing a draft pull request, as an exception
    runs-on: macos-latest
    steps:
      # Arrange
      - *check-out

      - *build

      - name: put a stand-in for gh on the PATH, for a GitHub that holds a draft pull request
        run: |
          mkdir "$RUNNER_TEMP/github"
          cat > "$RUNNER_TEMP/github/gh" <<'EOF'
          #!/bin/sh
          echo "OPEN true"
          EOF
          chmod +x "$RUNNER_TEMP/github/gh"
          echo "$RUNNER_TEMP/github" >> "$GITHUB_PATH"

      # Act
      - env:
          PAYLOAD: '{"tool_name":"Bash","tool_input":{"command":"gh pr edit 5 -R github.com/owner/repo --body z"}}'
        run: echo "$PAYLOAD" | claude-gh-admission-hook/target/release/claude-gh-admission-hook > "$RUNNER_TEMP/decision"

      # Assert
      - run: grep '"permissionDecision":"ask"' "$RUNNER_TEMP/decision"

  release-create:
    name: should ask before creating a draft release, as an exception
    runs-on: macos-latest
    steps:
      # Arrange
      - *check-out

      - *build

      # Act
      - env:
          PAYLOAD: '{"tool_name":"Bash","tool_input":{"command":"gh release create v1.0.0 --draft --title x --notes y"}}'
        run: echo "$PAYLOAD" | claude-gh-admission-hook/target/release/claude-gh-admission-hook > "$RUNNER_TEMP/decision"

      # Assert
      - run: grep '"permissionDecision":"ask"' "$RUNNER_TEMP/decision"

  release-edit:
    name: should ask before editing a draft release, as an exception
    runs-on: macos-latest
    steps:
      # Arrange
      - *check-out

      - *build

      - name: put a stand-in for gh on the PATH, for a GitHub that holds a draft release
        run: |
          mkdir "$RUNNER_TEMP/github"
          cat > "$RUNNER_TEMP/github/gh" <<'EOF'
          #!/bin/sh
          case "$1" in
            release) echo true ;;
            api) echo "HTTP/2.0 404 Not Found" ;;
          esac
          EOF
          chmod +x "$RUNNER_TEMP/github/gh"
          echo "$RUNNER_TEMP/github" >> "$GITHUB_PATH"

      # Act
      - env:
          PAYLOAD: '{"tool_name":"Bash","tool_input":{"command":"gh release edit v1.0.0 -R github.com/owner/repo --notes x"}}'
        run: echo "$PAYLOAD" | claude-gh-admission-hook/target/release/claude-gh-admission-hook > "$RUNNER_TEMP/decision"

      # Assert
      - run: grep '"permissionDecision":"ask"' "$RUNNER_TEMP/decision"

  actionable-denial:
    name: should explain a denial well enough for Claude to act on it
    runs-on: macos-latest
    steps:
      # Arrange
      - *check-out

      - *build

      # Act & Assert
      - uses: ./.github/actions/claude-gh-admission-hook-specs/actionable-denial
        with:
          guard: ${{ github.workspace }}/claude-gh-admission-hook/target/release/claude-gh-admission-hook

  unnecessary-changes:
    name: should make no unnecessary changes
    runs-on: ubuntu-latest
    steps:
      # Arrange
      - *check-out

      # Act & Assert
      - uses: yuyuyuyuyu-dev/assert-no-unexpected-changes@v1
        with:
          image: rust
          arrange: cargo build --release --locked --manifest-path claude-gh-admission-hook/Cargo.toml
          act: |
            guard=claude-gh-admission-hook/target/release/claude-gh-admission-hook
            echo '{"tool_name":"Bash","tool_input":{"command":"gh pr list"}}' | "$guard"
            echo '{"tool_name":"Bash","tool_input":{"command":"gh pr merge 5"}}' | "$guard"
            echo '{"tool_name":"Bash","tool_input":{"command":"gh pr create --draft --title x"}}' | "$guard"
