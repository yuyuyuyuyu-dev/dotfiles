name: remote-write-gate tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  read-only:
    name: should restrict GitHub access to read-only permission
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - run: cargo build --release --locked
        working-directory: remote-write-gate

      - uses: ./.github/actions/remote-write-gate-read-only
        with:
          guard: ${{ github.workspace }}/remote-write-gate/target/release/remote-write-gate

  pull-request-create:
    name: should ask before creating a pull request, as an exception
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - run: cargo build --release --locked
        working-directory: remote-write-gate

      - uses: ./.github/actions/remote-write-gate-pull-request-create
        with:
          guard: ${{ github.workspace }}/remote-write-gate/target/release/remote-write-gate

  pull-request-edit:
    name: should ask before editing a pull request, as an exception
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - run: cargo build --release --locked
        working-directory: remote-write-gate

      - uses: ./.github/actions/remote-write-gate-pull-request-edit
        with:
          guard: ${{ github.workspace }}/remote-write-gate/target/release/remote-write-gate

  actionable-denial:
    name: should explain a denial well enough for Claude to act on it
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - run: cargo build --release --locked
        working-directory: remote-write-gate

      - uses: ./.github/actions/remote-write-gate-actionable-denial
        with:
          guard: ${{ github.workspace }}/remote-write-gate/target/release/remote-write-gate
