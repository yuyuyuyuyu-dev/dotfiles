name: Deploy changes

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: should change nothing but the files it deploys
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: assert the deployment created nothing else
        uses: yuyuyuyuyu-dev/assert-no-unexpected-changes@v1
        with:
          arrange: apt-get update && apt-get install --yes --no-install-recommends python3 git
          act: mkdir /home/fresh && HOME=/home/fresh python3 -m deploy linux
          allowlist: |
            /home/fresh/.bash_profile
            /home/fresh/.bashrc
            /home/fresh/.zshrc
            /home/fresh/.zprofile
            /home/fresh/.zshenv
            /home/fresh/.zlogout
            /home/fresh/.vimrc
            /home/fresh/.config
            /home/fresh/.gitconfig
