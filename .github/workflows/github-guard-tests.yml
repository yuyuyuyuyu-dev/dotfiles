name: github-guard tests

on:
  # Limiting push to main avoids running twice for a pull request opened from a
  # branch in this same repository.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Each job is one thing the guard has to do, and the steps that establish it live
# in an action of its own under .github/actions, one step per point being made.
# The executable is what answers, not a function called from a test: these run the
# same binary Claude Code runs, on the payloads Claude Code sends it.
#
# Every job builds its own copy rather than sharing one through an artifact. The
# build is short, the jobs run at the same time anyway, and each one stays
# readable on its own.
jobs:
  read-only:
    name: should restrict GitHub access to read-only permission
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - run: cargo build --release --locked
        working-directory: github-guard

      - uses: ./.github/actions/github-guard-read-only
        with:
          guard: ${{ github.workspace }}/github-guard/target/release/github-guard

  pull-request-create:
    name: should ask before creating a pull request, as an exception
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - run: cargo build --release --locked
        working-directory: github-guard

      - uses: ./.github/actions/github-guard-pull-request-create
        with:
          guard: ${{ github.workspace }}/github-guard/target/release/github-guard

  pull-request-edit:
    name: should ask before editing a pull request, as an exception
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - run: cargo build --release --locked
        working-directory: github-guard

      - uses: ./.github/actions/github-guard-pull-request-edit
        with:
          guard: ${{ github.workspace }}/github-guard/target/release/github-guard

  actionable-denial:
    name: should explain a denial well enough for Claude to act on it
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - run: cargo build --release --locked
        working-directory: github-guard

      - uses: ./.github/actions/github-guard-actionable-denial
        with:
          guard: ${{ github.workspace }}/github-guard/target/release/github-guard
