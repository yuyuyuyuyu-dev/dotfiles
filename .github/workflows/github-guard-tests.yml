name: github-guard tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  read-only:
    name: should restrict GitHub access to read-only permission
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - run: cargo build --release --locked
        working-directory: github-guard

      - uses: ./.github/actions/github-guard-read-only
        with:
          guard: ${{ github.workspace }}/github-guard/target/release/github-guard

  pull-request-create:
    name: should ask before creating a pull request, as an exception
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - run: cargo build --release --locked
        working-directory: github-guard

      - uses: ./.github/actions/github-guard-pull-request-create
        with:
          guard: ${{ github.workspace }}/github-guard/target/release/github-guard

  pull-request-edit:
    name: should ask before editing a pull request, as an exception
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - run: cargo build --release --locked
        working-directory: github-guard

      - uses: ./.github/actions/github-guard-pull-request-edit
        with:
          guard: ${{ github.workspace }}/github-guard/target/release/github-guard

  actionable-denial:
    name: should explain a denial well enough for Claude to act on it
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - run: cargo build --release --locked
        working-directory: github-guard

      - uses: ./.github/actions/github-guard-actionable-denial
        with:
          guard: ${{ github.workspace }}/github-guard/target/release/github-guard
