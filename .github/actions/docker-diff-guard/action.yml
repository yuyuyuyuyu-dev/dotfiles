name: Docker diff guard
description: >-
  Run a command in a container and fail when it creates, changes or deletes
  anything the allowed list does not cover.

inputs:
  image:
    description: >-
      Image the command runs in. Defaults to the one pinned in the action's
      base-image.Dockerfile.
    required: false
    default: ""
  setup:
    description: >-
      Commands that prepare the environment, passed to `sh -e -c` while the
      image is built and with the checkout already in place. What they change
      lands in the image, so it is not part of what the command is measured
      against.
    required: false
    default: ""
  run:
    description: >-
      Command whose file changes are measured, passed to `sh -e -c` inside the
      container.
    required: true
  allowed:
    description: >-
      One entry per line. An entry is an absolute path, optionally preceded by
      `A`, `C` or `D` to allow only that kind of change -- added, changed or
      deleted. The path is a glob whose `*` also matches `/`, so
      `/root/.cache/*` covers everything below that directory. Blank lines and
      lines starting with `#` are ignored.
    required: true
  workdir:
    description: >-
      Where the checkout is placed inside the container, and the working
      directory the command starts in.
    default: /github/workspace

runs:
  using: composite
  steps:
    # The inputs are passed as environment variables rather than interpolated
    # into the script, so that a value containing shell syntax stays a value.
    - shell: sh
      env:
        ACTION_PATH: ${{ github.action_path }}
        INPUT_IMAGE: ${{ inputs.image }}
        INPUT_SETUP: ${{ inputs.setup }}
        INPUT_RUN: ${{ inputs.run }}
        INPUT_ALLOWED: ${{ inputs.allowed }}
        INPUT_WORKDIR: ${{ inputs.workdir }}
      run: |
        set -eu

        work="$(mktemp -d)"
        container=""
        untouched=""
        image=""

        cleanup() {
          for leftover in "${container}" "${untouched}"; do
            if [ -n "${leftover}" ]; then
              docker rm --force "${leftover}" > /dev/null || true
            fi
          done
          if [ -n "${image}" ]; then
            docker rmi --force "${image}" > /dev/null || true
          fi
          rm -rf "${work}"
        }
        trap cleanup EXIT

        # The runner does not enforce `required` on an action's inputs, so an
        # empty run input would otherwise take the diff of a container that did
        # nothing and report that as success.
        if [ -z "$(printf '%s' "${INPUT_RUN}" | tr -d '[:space:]')" ]; then
          echo "::error::the run input is empty, so there is nothing to verify"
          exit 1
        fi

        # Nothing builds base-image.Dockerfile. It is where the default image is
        # pinned, because Dependabot reads image references out of Dockerfiles
        # and not out of workflow inputs.
        base="${INPUT_IMAGE}"
        if [ -z "$(printf '%s' "${base}" | tr -d '[:space:]')" ]; then
          base="$(sed -n 's/^FROM[[:space:]]\{1,\}//p' "${ACTION_PATH}/base-image.Dockerfile" | head -n 1)"
        fi

        # The checkout is carried in as a layer rather than mounted, because a
        # bind mount is invisible to `docker diff`: a command that writes into
        # its own project directory -- installing dependencies there, building
        # into it -- could not do so at all against a read-only mount, and would
        # do so unmeasured against a writable one. In a layer it simply works.
        #
        # The setup commands run while the image is built, and land in it, which
        # is what makes them setup: preparing an environment is not what this
        # check is measuring.
        printf 'FROM %s\nARG SETUP\nWORKDIR %s\nCOPY . %s\nRUN sh -e -c "$SETUP"\n' \
          "${base}" "${INPUT_WORKDIR}" "${INPUT_WORKDIR}" \
          | SETUP="${INPUT_SETUP}" docker build \
            --build-arg SETUP \
            --iidfile "${work}/iid" \
            --file - \
            "${GITHUB_WORKSPACE}"
        image="$(cat "${work}/iid")"

        # Some runtime and storage driver combinations leave marks of their own
        # in the writable layer. Taking the diff of a container that ran nothing
        # keeps whatever those are out of the allowed list.
        docker run --cidfile "${work}/untouched-cid" "${image}" sh -e -c ':' < /dev/null
        untouched="$(cat "${work}/untouched-cid")"

        # Closing stdin turns a command that waits for input into a failure
        # rather than a job that hangs until the runner times out. `sh -e` stops
        # at the first failure in a command written as several, which would
        # otherwise be reported by whatever ran last.
        status=0
        docker run \
          --cidfile "${work}/cid" \
          "${image}" \
          sh -e -c "${INPUT_RUN}" \
          < /dev/null || status=$?

        # `docker diff` reads the container's writable layer, which is discarded
        # together with the container, so the container has to outlive the
        # command it ran.
        if [ -f "${work}/cid" ]; then
          container="$(cat "${work}/cid")"
        fi

        if [ "${status}" -ne 0 ]; then
          echo "::error::the command exited with status ${status}"
          exit "${status}"
        fi

        # The working directory is allowed without being asked for. It holds a
        # checkout of a repository with a remote, so a command that damages its
        # own sources is already answered -- by `git status`, which unlike
        # `docker diff` can tell a tracked file from a build artifact. What has
        # no other witness is what the command did to the machine around it, and
        # that is what this check is for. Making every caller enumerate its build
        # outputs instead would buy nothing and go stale with every dependency it
        # adds.
        printf '%s %s\n' '*' "${INPUT_WORKDIR%/}" > "${work}/allowed"
        printf '%s %s\n' '*' "${INPUT_WORKDIR%/}/*" >> "${work}/allowed"

        printf '%s\n' "${INPUT_ALLOWED}" > "${work}/input"
        while IFS= read -r entry; do
          entry="$(printf '%s' "${entry}" | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')"
          case "${entry}" in
            "" | \#*) continue ;;
          esac

          # The asterisk stands for an entry that names no kind and so allows any.
          kind='*'
          path="${entry}"
          case "${entry}" in
            [ACD][[:space:]]*)
              kind="$(printf '%s' "${entry}" | cut -c 1)"
              path="$(printf '%s' "${entry}" | sed 's/^[ACD][[:space:]]*//')"
              ;;
          esac

          case "${path}" in
            /*) ;;
            *)
              echo "::error::allowed entry '${entry}' is not an absolute path"
              exit 1
              ;;
          esac

          printf '%s %s\n' "${kind}" "${path}" >> "${work}/allowed"
        done < "${work}/input"

        docker diff "${untouched}" | LC_ALL=C sort > "${work}/untouched"
        docker diff "${container}" | LC_ALL=C sort > "${work}/observed"
        LC_ALL=C comm -13 "${work}/untouched" "${work}/observed" > "${work}/changes"

        covered_by_the_allowed_list() {
          change_kind="$1"
          change_path="$2"

          while read -r allowed_kind allowed_path; do
            if [ "${allowed_kind}" != '*' ] && [ "${allowed_kind}" != "${change_kind}" ]; then
              continue
            fi
            # The pattern is deliberately unquoted: an allowed entry is a glob.
            case "${change_path}" in
              ${allowed_path}) return 0 ;;
            esac
          done < "${work}/allowed"

          return 1
        }

        # A directory is reported as changed merely because something inside it
        # was created or deleted, and as created when it had to exist before
        # something inside it could. Such an entry follows from the change below
        # it rather than being a change of its own, so the allowed list only has
        # to name the latter. Nothing hides behind this: the change below is
        # reported on a line of its own and is checked there.
        follows_from_a_change_below() {
          directory="$1"

          while read -r below; do
            below="${below#* }"
            case "${below}" in
              "${directory}") continue ;;
              "${directory%/}"/*) return 0 ;;
            esac
          done < "${work}/changes"

          return 1
        }

        echo "docker diff reported $(grep -c '' "${work}/changes") change(s)"
        cat "${work}/changes"

        : > "${work}/violations"
        while IFS= read -r change; do
          kind="${change%% *}"
          path="${change#* }"

          if covered_by_the_allowed_list "${kind}" "${path}"; then
            continue
          fi

          if [ "${kind}" != D ] && follows_from_a_change_below "${path}"; then
            continue
          fi

          printf '%s\n' "${change}" >> "${work}/violations"
        done < "${work}/changes"

        violations="$(grep -c '' "${work}/violations" || true)"
        if [ "${violations}" -eq 0 ]; then
          echo "nothing outside the allowed list was created, changed or deleted"
          exit 0
        fi

        # A step is only allowed so many annotations before the rest are dropped,
        # so the count goes in the annotation and the paths go where nothing
        # truncates them.
        listed=200
        head -n "${listed}" "${work}/violations" > "${work}/report"
        if [ "${violations}" -gt "${listed}" ]; then
          echo "... and $((violations - listed)) more" >> "${work}/report"
        fi

        echo "::error::${violations} change(s) outside the allowed list"
        cat "${work}/report"

        if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
          {
            echo '### Changes outside the allowed list'
            echo
            echo '`A` created, `C` changed, `D` deleted.'
            echo
            echo '```'
            cat "${work}/report"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
        fi

        exit 1
