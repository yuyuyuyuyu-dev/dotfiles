name: Docker diff guard
description: >-
  Run a command in a container and fail when it creates, changes or deletes
  anything the allowed list does not cover.

inputs:
  image:
    description: >-
      Image the command runs in. Defaults to the one pinned in the action's
      base-image.Dockerfile.
    required: false
    default: ""
  setup:
    description: >-
      Commands that prepare the environment, passed to `sh -e -c` while the
      image is built and with the checkout already in place. What they change
      lands in the image, so it is not part of what the command is measured
      against.
    required: false
    default: ""
  run:
    description: >-
      Command whose file changes are measured, passed to `sh -e -c` inside the
      container.
    required: true
  allowed:
    description: >-
      One entry per line. An entry is an absolute path, optionally preceded by
      `A`, `C` or `D` to allow only that kind of change -- added, changed or
      deleted. The path is a glob whose `*` also matches `/`, so
      `/root/.cache/*` covers everything below that directory. Blank lines and
      lines starting with `#` are ignored.
    required: true
  workdir:
    description: >-
      Where the checkout is placed inside the container, and the working
      directory the command starts in.
    default: /github/workspace

runs:
  using: composite
  steps:
    - shell: sh
      env:
        ACTION_PATH: ${{ github.action_path }}
        INPUT_IMAGE: ${{ inputs.image }}
        INPUT_SETUP: ${{ inputs.setup }}
        INPUT_RUN: ${{ inputs.run }}
        INPUT_ALLOWED: ${{ inputs.allowed }}
        INPUT_WORKDIR: ${{ inputs.workdir }}
      run: |
        set -eu

        work="$(mktemp -d)"
        container=""
        untouched=""
        image=""

        cleanup() {
          for leftover in "${container}" "${untouched}"; do
            if [ -n "${leftover}" ]; then
              docker rm --force "${leftover}" > /dev/null || true
            fi
          done
          if [ -n "${image}" ]; then
            docker rmi --force "${image}" > /dev/null || true
          fi
          rm -rf "${work}"
        }
        trap cleanup EXIT

        if [ -z "$(printf '%s' "${INPUT_RUN}" | tr -d '[:space:]')" ]; then
          echo "::error::the run input is empty, so there is nothing to verify"
          exit 1
        fi

        base="${INPUT_IMAGE}"
        if [ -z "$(printf '%s' "${base}" | tr -d '[:space:]')" ]; then
          base="$(sed -n 's/^FROM[[:space:]]\{1,\}//p' "${ACTION_PATH}/base-image.Dockerfile" | head -n 1)"
        fi

        printf 'FROM %s\nARG SETUP\nWORKDIR %s\nCOPY . %s\nRUN sh -e -c "$SETUP"\n' \
          "${base}" "${INPUT_WORKDIR}" "${INPUT_WORKDIR}" \
          | SETUP="${INPUT_SETUP}" docker build \
            --build-arg SETUP \
            --iidfile "${work}/iid" \
            --file - \
            "${GITHUB_WORKSPACE}"
        image="$(cat "${work}/iid")"

        docker run --cidfile "${work}/untouched-cid" "${image}" sh -e -c ':' < /dev/null
        untouched="$(cat "${work}/untouched-cid")"

        status=0
        docker run \
          --cidfile "${work}/cid" \
          "${image}" \
          sh -e -c "${INPUT_RUN}" \
          < /dev/null || status=$?

        if [ -f "${work}/cid" ]; then
          container="$(cat "${work}/cid")"
        fi

        if [ "${status}" -ne 0 ]; then
          echo "::error::the command exited with status ${status}"
          exit "${status}"
        fi

        printf '%s %s\n' '*' "${INPUT_WORKDIR%/}" > "${work}/allowed"
        printf '%s %s\n' '*' "${INPUT_WORKDIR%/}/*" >> "${work}/allowed"

        printf '%s\n' "${INPUT_ALLOWED}" > "${work}/input"
        while IFS= read -r entry; do
          entry="$(printf '%s' "${entry}" | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')"
          case "${entry}" in
            "" | \#*) continue ;;
          esac

          kind='*'
          path="${entry}"
          case "${entry}" in
            [ACD][[:space:]]*)
              kind="$(printf '%s' "${entry}" | cut -c 1)"
              path="$(printf '%s' "${entry}" | sed 's/^[ACD][[:space:]]*//')"
              ;;
          esac

          case "${path}" in
            /*) ;;
            *)
              echo "::error::allowed entry '${entry}' is not an absolute path"
              exit 1
              ;;
          esac

          printf '%s %s\n' "${kind}" "${path}" >> "${work}/allowed"
        done < "${work}/input"

        docker diff "${untouched}" | LC_ALL=C sort > "${work}/untouched"
        docker diff "${container}" | LC_ALL=C sort > "${work}/observed"
        LC_ALL=C comm -13 "${work}/untouched" "${work}/observed" > "${work}/changes"

        covered_by_the_allowed_list() {
          change_kind="$1"
          change_path="$2"

          while read -r allowed_kind allowed_path; do
            if [ "${allowed_kind}" != '*' ] && [ "${allowed_kind}" != "${change_kind}" ]; then
              continue
            fi
            case "${change_path}" in
              ${allowed_path}) return 0 ;;
            esac
          done < "${work}/allowed"

          return 1
        }

        follows_from_a_change_below() {
          directory="$1"

          while read -r below; do
            below="${below#* }"
            case "${below}" in
              "${directory}") continue ;;
              "${directory%/}"/*) return 0 ;;
            esac
          done < "${work}/changes"

          return 1
        }

        echo "docker diff reported $(grep -c '' "${work}/changes") change(s)"
        cat "${work}/changes"

        : > "${work}/violations"
        while IFS= read -r change; do
          kind="${change%% *}"
          path="${change#* }"

          if covered_by_the_allowed_list "${kind}" "${path}"; then
            continue
          fi

          if [ "${kind}" != D ] && follows_from_a_change_below "${path}"; then
            continue
          fi

          printf '%s\n' "${change}" >> "${work}/violations"
        done < "${work}/changes"

        violations="$(grep -c '' "${work}/violations" || true)"
        if [ "${violations}" -eq 0 ]; then
          echo "nothing outside the allowed list was created, changed or deleted"
          exit 0
        fi

        listed=200
        head -n "${listed}" "${work}/violations" > "${work}/report"
        if [ "${violations}" -gt "${listed}" ]; then
          echo "... and $((violations - listed)) more" >> "${work}/report"
        fi

        echo "::error::${violations} change(s) outside the allowed list"
        cat "${work}/report"

        if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
          {
            echo '### Changes outside the allowed list'
            echo
            echo '`A` created, `C` changed, `D` deleted.'
            echo
            echo '```'
            cat "${work}/report"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
        fi

        exit 1
