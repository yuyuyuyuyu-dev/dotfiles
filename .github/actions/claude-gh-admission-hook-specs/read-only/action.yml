name: should restrict GitHub access to read-only permission
description: >-
  Feed claude-gh-admission-hook the payloads Claude Code would send and check
  that the writes it exists to stop are denied: creating a pull request, a tag
  or a release, pushing tags, and sending a write method to the GitHub API.
  One step is one write. Creating a pull request or a release is denied here
  as the rule; the drafts that are the exception have jobs of their own.

inputs:
  guard:
    description: The claude-gh-admission-hook executable to run the payloads through.
    required: true

runs:
  using: composite
  steps:
    - name: should deny creating a pull request
      shell: bash
      env:
        GUARD: ${{ inputs.guard }}
        PAYLOAD: '{"tool_name":"Bash","tool_input":{"command":"gh pr create --title x --body y"}}'
      run: echo "$PAYLOAD" | "$GUARD" | grep '"permissionDecision":"deny"'

    - name: should deny pushing tags
      shell: bash
      env:
        GUARD: ${{ inputs.guard }}
        PAYLOAD: '{"tool_name":"Bash","tool_input":{"command":"git push --tags"}}'
      run: echo "$PAYLOAD" | "$GUARD" | grep '"permissionDecision":"deny"'

    - name: should deny creating a tag
      shell: bash
      env:
        GUARD: ${{ inputs.guard }}
        PAYLOAD: '{"tool_name":"Bash","tool_input":{"command":"git tag v1.0.0"}}'
      run: echo "$PAYLOAD" | "$GUARD" | grep '"permissionDecision":"deny"'

    - name: should deny creating a release
      shell: bash
      env:
        GUARD: ${{ inputs.guard }}
        PAYLOAD: '{"tool_name":"Bash","tool_input":{"command":"gh release create v1.0.0"}}'
      run: echo "$PAYLOAD" | "$GUARD" | grep '"permissionDecision":"deny"'

    - name: should deny a POST sent with gh api
      shell: bash
      env:
        GUARD: ${{ inputs.guard }}
        PAYLOAD: '{"tool_name":"Bash","tool_input":{"command":"gh api -X POST /repos/o/r/issues"}}'
      run: echo "$PAYLOAD" | "$GUARD" | grep '"permissionDecision":"deny"'

    - name: should deny a PUT sent with gh api
      shell: bash
      env:
        GUARD: ${{ inputs.guard }}
        PAYLOAD: '{"tool_name":"Bash","tool_input":{"command":"gh api -X PUT /repos/o/r/topics"}}'
      run: echo "$PAYLOAD" | "$GUARD" | grep '"permissionDecision":"deny"'

    - name: should deny a PATCH sent with gh api
      shell: bash
      env:
        GUARD: ${{ inputs.guard }}
        PAYLOAD: '{"tool_name":"Bash","tool_input":{"command":"gh api -X PATCH /repos/o/r"}}'
      run: echo "$PAYLOAD" | "$GUARD" | grep '"permissionDecision":"deny"'

    - name: should deny a DELETE sent with gh api
      shell: bash
      env:
        GUARD: ${{ inputs.guard }}
        PAYLOAD: '{"tool_name":"Bash","tool_input":{"command":"gh api -X DELETE /repos/o/r"}}'
      run: echo "$PAYLOAD" | "$GUARD" | grep '"permissionDecision":"deny"'

    - name: should deny a POST sent with curl
      shell: bash
      env:
        GUARD: ${{ inputs.guard }}
        PAYLOAD: '{"tool_name":"Bash","tool_input":{"command":"curl -X POST https://api.github.com/repos/o/r/issues"}}'
      run: echo "$PAYLOAD" | "$GUARD" | grep '"permissionDecision":"deny"'

    - name: should deny a PUT sent with curl
      shell: bash
      env:
        GUARD: ${{ inputs.guard }}
        PAYLOAD: '{"tool_name":"Bash","tool_input":{"command":"curl -X PUT https://api.github.com/repos/o/r/topics"}}'
      run: echo "$PAYLOAD" | "$GUARD" | grep '"permissionDecision":"deny"'

    - name: should deny a PATCH sent with curl
      shell: bash
      env:
        GUARD: ${{ inputs.guard }}
        PAYLOAD: '{"tool_name":"Bash","tool_input":{"command":"curl -X PATCH https://api.github.com/repos/o/r"}}'
      run: echo "$PAYLOAD" | "$GUARD" | grep '"permissionDecision":"deny"'

    - name: should deny a DELETE sent with curl
      shell: bash
      env:
        GUARD: ${{ inputs.guard }}
        PAYLOAD: '{"tool_name":"Bash","tool_input":{"command":"curl -X DELETE https://api.github.com/repos/o/r"}}'
      run: echo "$PAYLOAD" | "$GUARD" | grep '"permissionDecision":"deny"'

    - name: should deny a POST sent with wget
      shell: bash
      env:
        GUARD: ${{ inputs.guard }}
        PAYLOAD: '{"tool_name":"Bash","tool_input":{"command":"wget --method=POST https://api.github.com/repos/o/r/issues"}}'
      run: echo "$PAYLOAD" | "$GUARD" | grep '"permissionDecision":"deny"'

    - name: should deny a PUT sent with wget
      shell: bash
      env:
        GUARD: ${{ inputs.guard }}
        PAYLOAD: '{"tool_name":"Bash","tool_input":{"command":"wget --method=PUT https://api.github.com/repos/o/r/topics"}}'
      run: echo "$PAYLOAD" | "$GUARD" | grep '"permissionDecision":"deny"'

    - name: should deny a PATCH sent with wget
      shell: bash
      env:
        GUARD: ${{ inputs.guard }}
        PAYLOAD: '{"tool_name":"Bash","tool_input":{"command":"wget --method=PATCH https://api.github.com/repos/o/r"}}'
      run: echo "$PAYLOAD" | "$GUARD" | grep '"permissionDecision":"deny"'

    - name: should deny a DELETE sent with wget
      shell: bash
      env:
        GUARD: ${{ inputs.guard }}
        PAYLOAD: '{"tool_name":"Bash","tool_input":{"command":"wget --method=DELETE https://api.github.com/repos/o/r"}}'
      run: echo "$PAYLOAD" | "$GUARD" | grep '"permissionDecision":"deny"'
