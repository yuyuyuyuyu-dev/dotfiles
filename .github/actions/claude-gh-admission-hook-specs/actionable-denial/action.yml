name: should explain a denial well enough for Claude to act on it
description: A spec of claude-gh-admission-hook.

runs:
  using: composite
  steps:
    - name: should state the rule the denial comes from
      shell: bash
      # Arrange
      env:
        PAYLOAD: '{"tool_name":"Bash","tool_input":{"command":"gh pr merge 5"}}'
        SENTENCE: >-
          GitHub access is read-only under this hook: every write is denied, and
          the only exceptions are creating a draft pull request, editing a draft
          pull request, creating a draft release and editing a draft release,
          which are put to the user for approval instead. As commands, they are
          `gh pr create --draft --title TITLE`, `gh pr edit NUMBER -R
          HOST/OWNER/REPO --body BODY` where NUMBER is an open draft pull
          request, `gh release create TAG --draft --title TITLE`, and `gh
          release edit TAG -R HOST/OWNER/REPO --notes NOTES` where TAG is the
          tag the draft release was created with.
      # Act & Assert
      run: echo "$PAYLOAD" | claude-gh-admission-hook/build/bin/macosArm64/releaseExecutable/claude-gh-admission-hook.kexe | grep -F -- "$SENTENCE"

    - name: should tell Claude to report a denial that looks like a fault
      shell: bash
      # Arrange
      env:
        PAYLOAD: '{"tool_name":"Bash","tool_input":{"command":"gh pr merge 5"}}'
        SENTENCE: >-
          If the command only reads and this denial looks like a fault in the
          hook, report that to the user instead of working around it.
      # Act & Assert
      run: echo "$PAYLOAD" | claude-gh-admission-hook/build/bin/macosArm64/releaseExecutable/claude-gh-admission-hook.kexe | grep -F -- "$SENTENCE"
