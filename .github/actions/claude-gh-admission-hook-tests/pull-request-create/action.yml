name: should ask about a new pull request only when it is surely a draft
description: Tests of claude-gh-admission-hook.

inputs:
  hook:
    description: The claude-gh-admission-hook executable to run the payloads through.
    required: true

runs:
  using: composite
  steps:
    - name: should ask when the draft flag is given in its short form
      shell: bash
      env:
        HOOK: ${{ inputs.hook }}
        PAYLOAD: '{"tool_name":"Bash","tool_input":{"command":"gh pr create -d --title x"}}'
      run: echo "$PAYLOAD" | "$HOOK" | grep '"permissionDecision":"ask"'

    - name: should ask when the body comes from a quoted command substitution
      shell: bash
      env:
        HOOK: ${{ inputs.hook }}
        PAYLOAD: '{"tool_name":"Bash","tool_input":{"command":"gh pr create --draft --title x --body \"$(cat body.md)\""}}'
      run: echo "$PAYLOAD" | "$HOOK" | grep '"permissionDecision":"ask"'

    - name: should ask when the creation is hidden in a nested shell
      shell: bash
      env:
        HOOK: ${{ inputs.hook }}
        PAYLOAD: '{"tool_name":"Bash","tool_input":{"command":"bash -c \"gh pr create --draft --title x\""}}'
      run: echo "$PAYLOAD" | "$HOOK" | grep '"permissionDecision":"ask"'

    - name: should ask when the repository is named before the subcommand
      shell: bash
      env:
        HOOK: ${{ inputs.hook }}
        PAYLOAD: '{"tool_name":"Bash","tool_input":{"command":"gh -R owner/repo pr create --draft --title x"}}'
      run: echo "$PAYLOAD" | "$HOOK" | grep '"permissionDecision":"ask"'

    - name: should deny when the draft flag is switched off
      shell: bash
      env:
        HOOK: ${{ inputs.hook }}
        PAYLOAD: '{"tool_name":"Bash","tool_input":{"command":"gh pr create --draft=false --title x"}}'
      run: echo "$PAYLOAD" | "$HOOK" | grep '"permissionDecision":"deny"'

    - name: should deny when --draft is only the value of another flag
      shell: bash
      env:
        HOOK: ${{ inputs.hook }}
        PAYLOAD: '{"tool_name":"Bash","tool_input":{"command":"gh pr create --title --draft"}}'
      run: echo "$PAYLOAD" | "$HOOK" | grep '"permissionDecision":"deny"'

    - name: should deny when --draft is only part of a comment
      shell: bash
      env:
        HOOK: ${{ inputs.hook }}
        PAYLOAD: '{"tool_name":"Bash","tool_input":{"command":"gh pr create --title x # --draft"}}'
      run: echo "$PAYLOAD" | "$HOOK" | grep '"permissionDecision":"deny"'

    - name: should deny when an unquoted expansion could turn into further flags
      shell: bash
      env:
        HOOK: ${{ inputs.hook }}
        PAYLOAD: '{"tool_name":"Bash","tool_input":{"command":"gh pr create --draft --title x $EXTRA"}}'
      run: echo "$PAYLOAD" | "$HOOK" | grep '"permissionDecision":"deny"'

    - name: should deny when further flags could follow a redirection unseen
      shell: bash
      env:
        HOOK: ${{ inputs.hook }}
        PAYLOAD: '{"tool_name":"Bash","tool_input":{"command":"gh pr create --draft --title x > /dev/null --draft=false"}}'
      run: echo "$PAYLOAD" | "$HOOK" | grep '"permissionDecision":"deny"'

    - name: should deny a flag GitHub has not shipped yet
      shell: bash
      env:
        HOOK: ${{ inputs.hook }}
        PAYLOAD: '{"tool_name":"Bash","tool_input":{"command":"gh pr create --draft --some-future-flag x"}}'
      run: echo "$PAYLOAD" | "$HOOK" | grep '"permissionDecision":"deny"'
