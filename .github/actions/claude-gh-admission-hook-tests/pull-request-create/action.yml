name: should ask about a new pull request only when it is surely a draft in a repository the user owns
description: Tests of claude-gh-admission-hook.

inputs:
  hook:
    description: The claude-gh-admission-hook executable to run the payloads through.
    required: true

runs:
  using: composite
  steps:
    - name: should ask when the draft flag is given in its short form
      shell: bash
      env:
        HOOK: ${{ inputs.hook }}
        STAND_IN: ${{ github.action_path }}/github-where-the-user-owns-the-repository
        PAYLOAD: '{"tool_name":"Bash","tool_input":{"command":"gh pr create -R github.com/owner/repo -d --title x"}}'
      run: echo "$PAYLOAD" | PATH="$STAND_IN:$PATH" "$HOOK" | grep '"permissionDecision":"ask"'

    - name: should ask when the body comes from a quoted command substitution
      shell: bash
      env:
        HOOK: ${{ inputs.hook }}
        STAND_IN: ${{ github.action_path }}/github-where-the-user-owns-the-repository
        PAYLOAD: '{"tool_name":"Bash","tool_input":{"command":"gh pr create -R github.com/owner/repo --draft --title x --body \"$(cat body.md)\""}}'
      run: echo "$PAYLOAD" | PATH="$STAND_IN:$PATH" "$HOOK" | grep '"permissionDecision":"ask"'

    - name: should ask when the creation is hidden in a nested shell
      shell: bash
      env:
        HOOK: ${{ inputs.hook }}
        STAND_IN: ${{ github.action_path }}/github-where-the-user-owns-the-repository
        PAYLOAD: '{"tool_name":"Bash","tool_input":{"command":"bash -c \"gh pr create -R github.com/owner/repo --draft --title x\""}}'
      run: echo "$PAYLOAD" | PATH="$STAND_IN:$PATH" "$HOOK" | grep '"permissionDecision":"ask"'

    - name: should ask when the repository is named before the subcommand
      shell: bash
      env:
        HOOK: ${{ inputs.hook }}
        STAND_IN: ${{ github.action_path }}/github-where-the-user-owns-the-repository
        PAYLOAD: '{"tool_name":"Bash","tool_input":{"command":"gh -R github.com/owner/repo pr create --draft --title x"}}'
      run: echo "$PAYLOAD" | PATH="$STAND_IN:$PATH" "$HOOK" | grep '"permissionDecision":"ask"'

    - name: should ask when a redirection follows the command
      shell: bash
      env:
        HOOK: ${{ inputs.hook }}
        STAND_IN: ${{ github.action_path }}/github-where-the-user-owns-the-repository
        PAYLOAD: '{"tool_name":"Bash","tool_input":{"command":"gh pr create -R github.com/owner/repo --draft --title x 2>&1"}}'
      run: echo "$PAYLOAD" | PATH="$STAND_IN:$PATH" "$HOOK" | grep '"permissionDecision":"ask"'

    - name: should deny when the repository is owned by another user, such as the one a fork was made from
      shell: bash
      env:
        HOOK: ${{ inputs.hook }}
        STAND_IN: ${{ github.action_path }}/github-where-another-user-owns-the-repository
        PAYLOAD: '{"tool_name":"Bash","tool_input":{"command":"gh pr create -R github.com/owner/repo --draft --title x"}}'
        SENTENCE: >-
          github.com/owner/repo is owned by owner, not by user, whom gh is
          signed in as on github.com. `gh pr create` is only allowed in a
          repository the user owns.
      run: |
        decision=$(echo "$PAYLOAD" | PATH="$STAND_IN:$PATH" "$HOOK")
        echo "$decision" | grep '"permissionDecision":"deny"'
        echo "$decision" | grep -F -- "$SENTENCE"

    - name: should deny when the repository is not named
      shell: bash
      env:
        HOOK: ${{ inputs.hook }}
        STAND_IN: ${{ github.action_path }}/github-where-the-user-owns-the-repository
        PAYLOAD: '{"tool_name":"Bash","tool_input":{"command":"gh pr create --draft --title x"}}'
      run: echo "$PAYLOAD" | PATH="$STAND_IN:$PATH" "$HOOK" | grep '"permissionDecision":"deny"'

    - name: should deny when the repository is named without its host
      shell: bash
      env:
        HOOK: ${{ inputs.hook }}
        STAND_IN: ${{ github.action_path }}/github-where-the-user-owns-the-repository
        PAYLOAD: '{"tool_name":"Bash","tool_input":{"command":"gh pr create -R owner/repo --draft --title x"}}'
        SENTENCE: If the repository is on github.com, that is -R github.com/owner/repo.
      run: |
        decision=$(echo "$PAYLOAD" | PATH="$STAND_IN:$PATH" "$HOOK")
        echo "$decision" | grep '"permissionDecision":"deny"'
        echo "$decision" | grep -F -- "$SENTENCE"

    - name: should deny when the repository is named by an expansion
      shell: bash
      env:
        HOOK: ${{ inputs.hook }}
        STAND_IN: ${{ github.action_path }}/github-where-the-user-owns-the-repository
        PAYLOAD: '{"tool_name":"Bash","tool_input":{"command":"gh pr create -R \"$REPO\" --draft --title x"}}'
      run: echo "$PAYLOAD" | REPO=github.com/owner/repo PATH="$STAND_IN:$PATH" "$HOOK" | grep '"permissionDecision":"deny"'

    - name: should deny rather than wait when GitHub does not answer
      shell: bash
      env:
        HOOK: ${{ inputs.hook }}
        STAND_IN: ${{ github.action_path }}/github-that-does-not-answer
        PAYLOAD: '{"tool_name":"Bash","tool_input":{"command":"gh pr create -R github.com/owner/repo --draft --title x"}}'
      run: echo "$PAYLOAD" | PATH="$STAND_IN:$PATH" "$HOOK" | grep '"permissionDecision":"deny"'

    - name: should deny when the draft flag is switched off
      shell: bash
      env:
        HOOK: ${{ inputs.hook }}
        PAYLOAD: '{"tool_name":"Bash","tool_input":{"command":"gh pr create --draft=false --title x"}}'
      run: echo "$PAYLOAD" | "$HOOK" | grep '"permissionDecision":"deny"'

    - name: should deny when --draft is only the value of another flag
      shell: bash
      env:
        HOOK: ${{ inputs.hook }}
        PAYLOAD: '{"tool_name":"Bash","tool_input":{"command":"gh pr create --title --draft"}}'
      run: echo "$PAYLOAD" | "$HOOK" | grep '"permissionDecision":"deny"'

    - name: should deny when --draft is only part of a comment
      shell: bash
      env:
        HOOK: ${{ inputs.hook }}
        PAYLOAD: '{"tool_name":"Bash","tool_input":{"command":"gh pr create --title x # --draft"}}'
      run: echo "$PAYLOAD" | "$HOOK" | grep '"permissionDecision":"deny"'

    - name: should deny when an unquoted expansion could turn into further flags
      shell: bash
      env:
        HOOK: ${{ inputs.hook }}
        PAYLOAD: '{"tool_name":"Bash","tool_input":{"command":"gh pr create --draft --title x $EXTRA"}}'
      run: echo "$PAYLOAD" | "$HOOK" | grep '"permissionDecision":"deny"'

    - name: should deny when a flag after a redirection turns --draft off
      shell: bash
      env:
        HOOK: ${{ inputs.hook }}
        PAYLOAD: '{"tool_name":"Bash","tool_input":{"command":"gh pr create --draft --title x > /dev/null --draft=false"}}'
        SENTENCE: >-
          `gh pr create` would open a pull request that is ready for review,
          because --draft is not in effect. Only a draft pull request may be
          created: pass --draft, and leave marking it as ready to the user.
      run: |
        decision=$(echo "$PAYLOAD" | "$HOOK")
        echo "$decision" | grep '"permissionDecision":"deny"'
        echo "$decision" | grep -F -- "$SENTENCE"

    - name: should deny when a flag ahead of the subcommand takes another subcommand for its value
      shell: bash
      env:
        HOOK: ${{ inputs.hook }}
        PAYLOAD: '{"tool_name":"Bash","tool_input":{"command":"gh pr --title view create --body x"}}'
        SENTENCE: >-
          `gh pr create` is put to the user only when this hook can read every
          argument of it, and here it cannot: --title comes before `pr create`,
          where gh may take the word after it for its value. Put it after `pr
          create`.
      run: |
        decision=$(echo "$PAYLOAD" | "$HOOK")
        echo "$decision" | grep '"permissionDecision":"deny"'
        echo "$decision" | grep -F -- "$SENTENCE"

    - name: should deny when xargs could add flags unseen
      shell: bash
      env:
        HOOK: ${{ inputs.hook }}
        PAYLOAD: '{"tool_name":"Bash","tool_input":{"command":"echo --draft=false | xargs gh pr create -R github.com/owner/repo --draft --title x"}}'
        SENTENCE: >-
          This gh command is run through xargs or parallel, which adds arguments
          that this hook cannot see, and they could turn it into a write. Give gh
          all of its arguments on the command line itself.
      run: |
        decision=$(echo "$PAYLOAD" | "$HOOK")
        echo "$decision" | grep '"permissionDecision":"deny"'
        echo "$decision" | grep -F -- "$SENTENCE"

    - name: should deny a flag GitHub has not shipped yet
      shell: bash
      env:
        HOOK: ${{ inputs.hook }}
        PAYLOAD: '{"tool_name":"Bash","tool_input":{"command":"gh pr create --draft --some-future-flag x"}}'
      run: echo "$PAYLOAD" | "$HOOK" | grep '"permissionDecision":"deny"'
