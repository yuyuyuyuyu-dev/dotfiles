name: should deny a push to the default branch
description: Tests of claude-gh-admission-hook.

inputs:
  hook:
    description: The claude-gh-admission-hook executable to run the payloads through.
    required: true

runs:
  using: composite
  steps:
    - name: should deny pushing the default branch while it is checked out
      shell: bash
      env:
        HOOK: ${{ inputs.hook }}
        GIT_CONFIG_GLOBAL: /dev/null
        GIT_CONFIG_NOSYSTEM: "1"
        PAYLOAD: '{"tool_name":"Bash","tool_input":{"command":"git push -u origin HEAD"}}'
        SENTENCE: >-
          `git push` would push to main, which is the default branch of origin.
          Only a branch other than the default branch may be pushed: create one
          with `git switch -c NAME`, and push it with `git push -u origin HEAD`.
      run: |
        cd "$(mktemp -d)"
        git init --quiet --initial-branch=main work
        git -C work -c user.name=x -c user.email=x@example.com commit --quiet --allow-empty -m x
        git clone --quiet --bare work remote.git
        cd work
        git remote add origin ../remote.git
        decision=$(echo "$PAYLOAD" | "$HOOK")
        echo "$decision" | grep '"permissionDecision":"deny"'
        echo "$decision" | grep -F -- "$SENTENCE"

    - name: should deny a push that names nothing while the default branch is checked out
      shell: bash
      env:
        HOOK: ${{ inputs.hook }}
        GIT_CONFIG_GLOBAL: /dev/null
        GIT_CONFIG_NOSYSTEM: "1"
        PAYLOAD: '{"tool_name":"Bash","tool_input":{"command":"git push"}}'
      run: |
        cd "$(mktemp -d)"
        git init --quiet --initial-branch=main work
        git -C work -c user.name=x -c user.email=x@example.com commit --quiet --allow-empty -m x
        git clone --quiet --bare work remote.git
        cd work
        git remote add origin ../remote.git
        git config branch.main.remote origin
        git config branch.main.merge refs/heads/main
        decision=$(echo "$PAYLOAD" | "$HOOK")
        echo "$decision" | grep '"permissionDecision":"deny"'

    - name: should deny pushing the default branch by its full name from another branch
      shell: bash
      env:
        HOOK: ${{ inputs.hook }}
        GIT_CONFIG_GLOBAL: /dev/null
        GIT_CONFIG_NOSYSTEM: "1"
        PAYLOAD: '{"tool_name":"Bash","tool_input":{"command":"git push origin refs/heads/main"}}'
      run: |
        cd "$(mktemp -d)"
        git init --quiet --initial-branch=main work
        git -C work -c user.name=x -c user.email=x@example.com commit --quiet --allow-empty -m x
        git clone --quiet --bare work remote.git
        cd work
        git remote add origin ../remote.git
        git switch --quiet -c feature/x
        decision=$(echo "$PAYLOAD" | "$HOOK")
        echo "$decision" | grep '"permissionDecision":"deny"'

    - name: should deny pushing another branch to the default branch
      shell: bash
      env:
        HOOK: ${{ inputs.hook }}
        GIT_CONFIG_GLOBAL: /dev/null
        GIT_CONFIG_NOSYSTEM: "1"
        PAYLOAD: '{"tool_name":"Bash","tool_input":{"command":"git push origin HEAD:refs/heads/main"}}'
      run: |
        cd "$(mktemp -d)"
        git init --quiet --initial-branch=main work
        git -C work -c user.name=x -c user.email=x@example.com commit --quiet --allow-empty -m x
        git clone --quiet --bare work remote.git
        cd work
        git remote add origin ../remote.git
        git switch --quiet -c feature/x
        decision=$(echo "$PAYLOAD" | "$HOOK")
        echo "$decision" | grep '"permissionDecision":"deny"'

    - name: should deny a push that names nothing when its upstream is the default branch
      shell: bash
      env:
        HOOK: ${{ inputs.hook }}
        GIT_CONFIG_GLOBAL: /dev/null
        GIT_CONFIG_NOSYSTEM: "1"
        PAYLOAD: '{"tool_name":"Bash","tool_input":{"command":"git push"}}'
      run: |
        cd "$(mktemp -d)"
        git init --quiet --initial-branch=main work
        git -C work -c user.name=x -c user.email=x@example.com commit --quiet --allow-empty -m x
        git clone --quiet --bare work remote.git
        cd work
        git remote add origin ../remote.git
        git switch --quiet -c feature/x
        git config push.default upstream
        git config branch.feature/x.remote origin
        git config branch.feature/x.merge refs/heads/main
        decision=$(echo "$PAYLOAD" | "$HOOK")
        echo "$decision" | grep '"permissionDecision":"deny"'

    - name: should deny a push that the git configuration maps to the default branch
      shell: bash
      env:
        HOOK: ${{ inputs.hook }}
        GIT_CONFIG_GLOBAL: /dev/null
        GIT_CONFIG_NOSYSTEM: "1"
        PAYLOAD: '{"tool_name":"Bash","tool_input":{"command":"git push origin HEAD"}}'
      run: |
        cd "$(mktemp -d)"
        git init --quiet --initial-branch=main work
        git -C work -c user.name=x -c user.email=x@example.com commit --quiet --allow-empty -m x
        git clone --quiet --bare work remote.git
        cd work
        git remote add origin ../remote.git
        git switch --quiet -c feature/x
        git config remote.origin.push 'refs/heads/feature/x:refs/heads/main'
        decision=$(echo "$PAYLOAD" | "$HOOK")
        echo "$decision" | grep '"permissionDecision":"deny"'

    - name: should deny a push that the git configuration makes push every branch
      shell: bash
      env:
        HOOK: ${{ inputs.hook }}
        GIT_CONFIG_GLOBAL: /dev/null
        GIT_CONFIG_NOSYSTEM: "1"
        PAYLOAD: '{"tool_name":"Bash","tool_input":{"command":"git push"}}'
      run: |
        cd "$(mktemp -d)"
        git init --quiet --initial-branch=main work
        git -C work -c user.name=x -c user.email=x@example.com commit --quiet --allow-empty -m x
        git clone --quiet --bare work remote.git
        cd work
        git remote add origin ../remote.git
        git switch --quiet -c feature/x
        git config remote.origin.push 'refs/heads/*:refs/heads/*'
        decision=$(echo "$PAYLOAD" | "$HOOK")
        echo "$decision" | grep '"permissionDecision":"deny"'

    - name: should deny a push that names nothing when push.default pushes every matching branch
      shell: bash
      env:
        HOOK: ${{ inputs.hook }}
        GIT_CONFIG_GLOBAL: /dev/null
        GIT_CONFIG_NOSYSTEM: "1"
        PAYLOAD: '{"tool_name":"Bash","tool_input":{"command":"git push"}}'
      run: |
        cd "$(mktemp -d)"
        git init --quiet --initial-branch=main work
        git -C work -c user.name=x -c user.email=x@example.com commit --quiet --allow-empty -m x
        git clone --quiet --bare work remote.git
        cd work
        git remote add origin ../remote.git
        git switch --quiet -c feature/x
        git config push.default matching
        decision=$(echo "$PAYLOAD" | "$HOOK")
        echo "$decision" | grep '"permissionDecision":"deny"'

    - name: should deny pushing every branch
      shell: bash
      env:
        HOOK: ${{ inputs.hook }}
        GIT_CONFIG_GLOBAL: /dev/null
        GIT_CONFIG_NOSYSTEM: "1"
        PAYLOAD: '{"tool_name":"Bash","tool_input":{"command":"git push --all origin"}}'
      run: |
        cd "$(mktemp -d)"
        git init --quiet --initial-branch=main work
        git -C work -c user.name=x -c user.email=x@example.com commit --quiet --allow-empty -m x
        git clone --quiet --bare work remote.git
        cd work
        git remote add origin ../remote.git
        git switch --quiet -c feature/x
        decision=$(echo "$PAYLOAD" | "$HOOK")
        echo "$decision" | grep '"permissionDecision":"deny"'

    - name: should deny pushing HEAD while it is detached
      shell: bash
      env:
        HOOK: ${{ inputs.hook }}
        GIT_CONFIG_GLOBAL: /dev/null
        GIT_CONFIG_NOSYSTEM: "1"
        PAYLOAD: '{"tool_name":"Bash","tool_input":{"command":"git push origin HEAD"}}'
        SENTENCE: >-
          `git push` would push the branch that is checked out, but HEAD is
          detached, so which branch it would push to cannot be determined.
      run: |
        cd "$(mktemp -d)"
        git init --quiet --initial-branch=main work
        git -C work -c user.name=x -c user.email=x@example.com commit --quiet --allow-empty -m x
        git clone --quiet --bare work remote.git
        cd work
        git remote add origin ../remote.git
        git switch --quiet --detach
        decision=$(echo "$PAYLOAD" | "$HOOK")
        echo "$decision" | grep '"permissionDecision":"deny"'
        echo "$decision" | grep -F -- "$SENTENCE"

    - name: should deny a push when the default branch of the remote cannot be looked up
      shell: bash
      env:
        HOOK: ${{ inputs.hook }}
        GIT_CONFIG_GLOBAL: /dev/null
        GIT_CONFIG_NOSYSTEM: "1"
        PAYLOAD: '{"tool_name":"Bash","tool_input":{"command":"git push nowhere HEAD"}}'
        SENTENCE: >-
          `git push` is let through only after this hook has made sure that it
          does not push to the default branch, and that could not be done
      run: |
        cd "$(mktemp -d)"
        git init --quiet --initial-branch=main work
        git -C work -c user.name=x -c user.email=x@example.com commit --quiet --allow-empty -m x
        git clone --quiet --bare work remote.git
        cd work
        git remote add origin ../remote.git
        git switch --quiet -c feature/x
        decision=$(echo "$PAYLOAD" | "$HOOK")
        echo "$decision" | grep '"permissionDecision":"deny"'
        echo "$decision" | grep -F -- "$SENTENCE"

    - name: should deny a push in a command that also switches the branch
      shell: bash
      env:
        HOOK: ${{ inputs.hook }}
        GIT_CONFIG_GLOBAL: /dev/null
        GIT_CONFIG_NOSYSTEM: "1"
        PAYLOAD: '{"tool_name":"Bash","tool_input":{"command":"git switch main && git push origin HEAD"}}'
        SENTENCE: >-
          `git push` and git commands that may be aliases are let through only
          after this hook has looked at the git configuration they would run under
          and the branch that is checked out, and this command also may switch the
          branch that is checked out with `git switch`, so either could be another
          one by the time they run.
      run: |
        cd "$(mktemp -d)"
        git init --quiet --initial-branch=main work
        git -C work -c user.name=x -c user.email=x@example.com commit --quiet --allow-empty -m x
        git clone --quiet --bare work remote.git
        cd work
        git remote add origin ../remote.git
        git switch --quiet -c feature/x
        decision=$(echo "$PAYLOAD" | "$HOOK")
        echo "$decision" | grep '"permissionDecision":"deny"'
        echo "$decision" | grep -F -- "$SENTENCE"

    - name: should deny a push in a command that also checks out a branch
      shell: bash
      env:
        HOOK: ${{ inputs.hook }}
        GIT_CONFIG_GLOBAL: /dev/null
        GIT_CONFIG_NOSYSTEM: "1"
        PAYLOAD: '{"tool_name":"Bash","tool_input":{"command":"git checkout main && git push origin HEAD"}}'
      run: |
        cd "$(mktemp -d)"
        git init --quiet --initial-branch=main work
        git -C work -c user.name=x -c user.email=x@example.com commit --quiet --allow-empty -m x
        git clone --quiet --bare work remote.git
        cd work
        git remote add origin ../remote.git
        git switch --quiet -c feature/x
        decision=$(echo "$PAYLOAD" | "$HOOK")
        echo "$decision" | grep '"permissionDecision":"deny"'

    - name: should deny a push in a command that also renames the branch
      shell: bash
      env:
        HOOK: ${{ inputs.hook }}
        GIT_CONFIG_GLOBAL: /dev/null
        GIT_CONFIG_NOSYSTEM: "1"
        PAYLOAD: '{"tool_name":"Bash","tool_input":{"command":"git branch -m main && git push origin HEAD"}}'
      run: |
        cd "$(mktemp -d)"
        git init --quiet --initial-branch=main work
        git -C work -c user.name=x -c user.email=x@example.com commit --quiet --allow-empty -m x
        git clone --quiet --bare work remote.git
        cd work
        git remote add origin ../remote.git
        git switch --quiet -c feature/x
        decision=$(echo "$PAYLOAD" | "$HOOK")
        echo "$decision" | grep '"permissionDecision":"deny"'

    - name: should deny a push in a command that also checks out a pull request
      shell: bash
      env:
        HOOK: ${{ inputs.hook }}
        GIT_CONFIG_GLOBAL: /dev/null
        GIT_CONFIG_NOSYSTEM: "1"
        PAYLOAD: '{"tool_name":"Bash","tool_input":{"command":"gh pr checkout 5 && git push origin HEAD"}}'
      run: |
        cd "$(mktemp -d)"
        git init --quiet --initial-branch=main work
        git -C work -c user.name=x -c user.email=x@example.com commit --quiet --allow-empty -m x
        git clone --quiet --bare work remote.git
        cd work
        git remote add origin ../remote.git
        git switch --quiet -c feature/x
        decision=$(echo "$PAYLOAD" | "$HOOK")
        echo "$decision" | grep '"permissionDecision":"deny"'
