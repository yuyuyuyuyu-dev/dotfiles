name: should ask about a release edit only when it surely reaches a draft
description: Tests of claude-gh-admission-hook.

inputs:
  hook:
    description: The claude-gh-admission-hook executable to run the payloads through.
    required: true

runs:
  using: composite
  steps:
    - name: should ask when the edit is hidden in a nested shell
      shell: bash
      env:
        HOOK: ${{ inputs.hook }}
        STAND_IN: ${{ github.action_path }}/github-with-a-draft
        PAYLOAD: '{"tool_name":"Bash","tool_input":{"command":"bash -c \"gh release edit v1.0.0 -R github.com/owner/repo --notes x\""}}'
      run: echo "$PAYLOAD" | PATH="$STAND_IN:$PATH" "$HOOK" | grep '"permissionDecision":"ask"'

    - name: should ask when the repository is named before the subcommand
      shell: bash
      env:
        HOOK: ${{ inputs.hook }}
        STAND_IN: ${{ github.action_path }}/github-with-a-draft
        PAYLOAD: '{"tool_name":"Bash","tool_input":{"command":"gh -R github.com/owner/repo release edit v1.0.0 --title x"}}'
      run: echo "$PAYLOAD" | PATH="$STAND_IN:$PATH" "$HOOK" | grep '"permissionDecision":"ask"'

    - name: should deny editing a published release
      shell: bash
      env:
        HOOK: ${{ inputs.hook }}
        STAND_IN: ${{ github.action_path }}/github-with-a-published-release
        PAYLOAD: '{"tool_name":"Bash","tool_input":{"command":"gh release edit v1.0.0 -R github.com/owner/repo --notes x"}}'
        SENTENCE: Release v1.0.0 in github.com/owner/repo is published
      run: |
        decision=$(echo "$PAYLOAD" | PATH="$STAND_IN:$PATH" "$HOOK")
        echo "$decision" | grep '"permissionDecision":"deny"'
        echo "$decision" | grep -F -- "$SENTENCE"

    - name: should deny editing a release it cannot find
      shell: bash
      env:
        HOOK: ${{ inputs.hook }}
        GH_TOKEN: ${{ github.token }}
        PAYLOAD: '{"tool_name":"Bash","tool_input":{"command":"gh release edit no-such-release -R github.com/${{ github.repository }} --notes x"}}'
        SENTENCE: >-
          whether no-such-release in github.com/${{ github.repository }} is one
          could not be found out: `gh release view` failed (release not found)
      run: |
        decision=$(echo "$PAYLOAD" | "$HOOK")
        echo "$decision" | grep '"permissionDecision":"deny"'
        echo "$decision" | grep -F -- "$SENTENCE"

    - name: should deny when a published release shares the tag of the draft
      shell: bash
      env:
        HOOK: ${{ inputs.hook }}
        STAND_IN: ${{ github.action_path }}/github-with-a-draft-and-a-published-release-under-one-tag
        PAYLOAD: '{"tool_name":"Bash","tool_input":{"command":"gh release edit v1.0.0 -R github.com/owner/repo --notes x"}}'
      run: echo "$PAYLOAD" | PATH="$STAND_IN:$PATH" "$HOOK" | grep '"permissionDecision":"deny"'

    - name: should deny rather than wait when GitHub does not answer
      shell: bash
      env:
        HOOK: ${{ inputs.hook }}
        STAND_IN: ${{ github.action_path }}/github-that-does-not-answer
        PAYLOAD: '{"tool_name":"Bash","tool_input":{"command":"gh release edit v1.0.0 -R github.com/owner/repo --notes x"}}'
      run: echo "$PAYLOAD" | PATH="$STAND_IN:$PATH" "$HOOK" | grep '"permissionDecision":"deny"'

    - name: should deny publishing the draft
      shell: bash
      env:
        HOOK: ${{ inputs.hook }}
        STAND_IN: ${{ github.action_path }}/github-with-a-draft
        PAYLOAD: '{"tool_name":"Bash","tool_input":{"command":"gh release edit v1.0.0 -R github.com/owner/repo --draft=false"}}'
      run: echo "$PAYLOAD" | PATH="$STAND_IN:$PATH" "$HOOK" | grep '"permissionDecision":"deny"'

    - name: should deny when the repository is not named
      shell: bash
      env:
        HOOK: ${{ inputs.hook }}
        STAND_IN: ${{ github.action_path }}/github-with-a-draft
        PAYLOAD: '{"tool_name":"Bash","tool_input":{"command":"gh release edit v1.0.0 --notes x"}}'
      run: echo "$PAYLOAD" | PATH="$STAND_IN:$PATH" "$HOOK" | grep '"permissionDecision":"deny"'

    - name: should deny when the repository is named without its host
      shell: bash
      env:
        HOOK: ${{ inputs.hook }}
        STAND_IN: ${{ github.action_path }}/github-with-a-draft
        PAYLOAD: '{"tool_name":"Bash","tool_input":{"command":"gh release edit v1.0.0 -R owner/repo --notes x"}}'
      run: echo "$PAYLOAD" | PATH="$STAND_IN:$PATH" "$HOOK" | grep '"permissionDecision":"deny"'

    - name: should deny when the tag comes out of an expansion
      shell: bash
      env:
        HOOK: ${{ inputs.hook }}
        STAND_IN: ${{ github.action_path }}/github-with-a-draft
        PAYLOAD: '{"tool_name":"Bash","tool_input":{"command":"gh release edit \"$TAG\" -R github.com/owner/repo --notes x"}}'
      run: echo "$PAYLOAD" | PATH="$STAND_IN:$PATH" "$HOOK" | grep '"permissionDecision":"deny"'

    - name: should deny when further flags could follow a redirection unseen
      shell: bash
      env:
        HOOK: ${{ inputs.hook }}
        STAND_IN: ${{ github.action_path }}/github-with-a-draft
        PAYLOAD: '{"tool_name":"Bash","tool_input":{"command":"gh release edit v1.0.0 -R github.com/owner/repo --notes x > /dev/null --draft=false"}}'
      run: echo "$PAYLOAD" | PATH="$STAND_IN:$PATH" "$HOOK" | grep '"permissionDecision":"deny"'

    - name: should deny a flag GitHub has not shipped yet
      shell: bash
      env:
        HOOK: ${{ inputs.hook }}
        STAND_IN: ${{ github.action_path }}/github-with-a-draft
        PAYLOAD: '{"tool_name":"Bash","tool_input":{"command":"gh release edit v1.0.0 -R github.com/owner/repo --some-future-flag x"}}'
      run: echo "$PAYLOAD" | PATH="$STAND_IN:$PATH" "$HOOK" | grep '"permissionDecision":"deny"'
