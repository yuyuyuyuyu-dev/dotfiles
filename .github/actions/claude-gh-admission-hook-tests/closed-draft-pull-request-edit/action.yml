name: should deny editing a draft pull request that is closed
description: >-
  GitHub goes on calling a pull request a draft after it is closed, so a guard
  that looked at the draft mark alone would let a closed one be edited. A test
  cannot keep such a pull request on GitHub, so the step puts a stand-in for gh
  on the PATH, named after what GitHub would hold.

inputs:
  guard:
    description: The claude-gh-admission-hook executable to run the payloads through.
    required: true

runs:
  using: composite
  steps:
    - name: should deny editing a draft pull request that is closed
      shell: bash
      env:
        GUARD: ${{ inputs.guard }}
        STAND_IN: ${{ github.action_path }}/github-with-a-closed-draft-pull-request
        PAYLOAD: '{"tool_name":"Bash","tool_input":{"command":"gh pr edit 5 -R github.com/owner/repo --body z"}}'
        SENTENCE: Pull request 5 in github.com/owner/repo is closed
      run: |
        decision=$(echo "$PAYLOAD" | PATH="$STAND_IN:$PATH" "$GUARD")
        echo "$decision" | grep '"permissionDecision":"deny"'
        echo "$decision" | grep -F -- "$SENTENCE"
