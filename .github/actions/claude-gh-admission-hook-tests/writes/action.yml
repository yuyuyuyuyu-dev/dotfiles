name: should deny the writes that are not exceptions
description: Tests of claude-gh-admission-hook.

inputs:
  hook:
    description: The claude-gh-admission-hook executable to run the payloads through.
    required: true

runs:
  using: composite
  steps:
    - name: should deny merging a pull request
      shell: bash
      env:
        HOOK: ${{ inputs.hook }}
        PAYLOAD: '{"tool_name":"Bash","tool_input":{"command":"gh pr merge 5"}}'
      run: echo "$PAYLOAD" | "$HOOK" | grep '"permissionDecision":"deny"'

    - name: should deny reviewing a pull request
      shell: bash
      env:
        HOOK: ${{ inputs.hook }}
        PAYLOAD: '{"tool_name":"Bash","tool_input":{"command":"gh pr review 5 --approve"}}'
      run: echo "$PAYLOAD" | "$HOOK" | grep '"permissionDecision":"deny"'

    - name: should deny commenting on an issue
      shell: bash
      env:
        HOOK: ${{ inputs.hook }}
        PAYLOAD: '{"tool_name":"Bash","tool_input":{"command":"gh issue comment 12 --body hi"}}'
      run: echo "$PAYLOAD" | "$HOOK" | grep '"permissionDecision":"deny"'

    - name: should deny changing repository settings
      shell: bash
      env:
        HOOK: ${{ inputs.hook }}
        PAYLOAD: '{"tool_name":"Bash","tool_input":{"command":"gh repo edit --visibility public"}}'
      run: echo "$PAYLOAD" | "$HOOK" | grep '"permissionDecision":"deny"'

    - name: should deny deleting a repository
      shell: bash
      env:
        HOOK: ${{ inputs.hook }}
        PAYLOAD: '{"tool_name":"Bash","tool_input":{"command":"gh repo delete owner/name"}}'
      run: echo "$PAYLOAD" | "$HOOK" | grep '"permissionDecision":"deny"'

    - name: should deny setting a secret
      shell: bash
      env:
        HOOK: ${{ inputs.hook }}
        PAYLOAD: '{"tool_name":"Bash","tool_input":{"command":"gh secret set TOKEN"}}'
      run: echo "$PAYLOAD" | "$HOOK" | grep '"permissionDecision":"deny"'

    - name: should deny a subcommand GitHub has not shipped yet
      shell: bash
      env:
        HOOK: ${{ inputs.hook }}
        PAYLOAD: '{"tool_name":"Bash","tool_input":{"command":"gh pr some-future-write 5"}}'
      run: echo "$PAYLOAD" | "$HOOK" | grep '"permissionDecision":"deny"'

    - name: should deny a REST API write that only its fields imply
      shell: bash
      env:
        HOOK: ${{ inputs.hook }}
        PAYLOAD: '{"tool_name":"Bash","tool_input":{"command":"gh api /repos/o/r/issues -f title=x"}}'
      run: echo "$PAYLOAD" | "$HOOK" | grep '"permissionDecision":"deny"'

    - name: should deny a GraphQL mutation
      shell: bash
      env:
        HOOK: ${{ inputs.hook }}
        PAYLOAD: '{"tool_name":"Bash","tool_input":{"command":"gh api graphql -f query=mutation{addComment}"}}'
      run: echo "$PAYLOAD" | "$HOOK" | grep '"permissionDecision":"deny"'

    - name: should deny pushing a tag refspec
      shell: bash
      env:
        HOOK: ${{ inputs.hook }}
        PAYLOAD: '{"tool_name":"Bash","tool_input":{"command":"git push origin HEAD:refs/tags/v1.0.0"}}'
      run: echo "$PAYLOAD" | "$HOOK" | grep '"permissionDecision":"deny"'

    - name: should deny reading the credential gh stored
      shell: bash
      env:
        HOOK: ${{ inputs.hook }}
        PAYLOAD: '{"tool_name":"Bash","tool_input":{"command":"gh auth token"}}'
      run: echo "$PAYLOAD" | "$HOOK" | grep '"permissionDecision":"deny"'

    - name: should deny a write that fetches a token to authenticate with
      shell: bash
      env:
        HOOK: ${{ inputs.hook }}
        PAYLOAD: '{"tool_name":"Bash","tool_input":{"command":"curl -X POST -H \"Authorization: Bearer $(gh auth token)\" https://api.github.com/repos/o/r/releases"}}'
      run: echo "$PAYLOAD" | "$HOOK" | grep '"permissionDecision":"deny"'

    - name: should deny a write that authenticates from the environment
      shell: bash
      env:
        HOOK: ${{ inputs.hook }}
        PAYLOAD: '{"tool_name":"Bash","tool_input":{"command":"curl -X POST -H \"Authorization: Bearer $GITHUB_TOKEN\" https://api.github.com/repos/o/r/releases"}}'
      run: echo "$PAYLOAD" | "$HOOK" | grep '"permissionDecision":"deny"'

    - name: should deny a write hidden in a nested shell
      shell: bash
      env:
        HOOK: ${{ inputs.hook }}
        PAYLOAD: '{"tool_name":"Bash","tool_input":{"command":"bash -c \"gh issue create --title x\""}}'
      run: echo "$PAYLOAD" | "$HOOK" | grep '"permissionDecision":"deny"'

    - name: should deny a write hidden in a command substitution
      shell: bash
      env:
        HOOK: ${{ inputs.hook }}
        PAYLOAD: '{"tool_name":"Bash","tool_input":{"command":"echo $(gh repo delete owner/name)"}}'
      run: echo "$PAYLOAD" | "$HOOK" | grep '"permissionDecision":"deny"'

    - name: should deny a write whose method a comment seems to turn into a read
      shell: bash
      env:
        HOOK: ${{ inputs.hook }}
        PAYLOAD: '{"tool_name":"Bash","tool_input":{"command":"gh api -X DELETE repos/o/r/git/refs/heads/x # -X GET"}}'
        SENTENCE: >-
          `gh api` would send DELETE, which is not a read and can change GitHub
          state. Only GET and HEAD are allowed here.
      run: |
        decision=$(echo "$PAYLOAD" | "$HOOK")
        echo "$decision" | grep '"permissionDecision":"deny"'
        echo "$decision" | grep -F -- "$SENTENCE"

    - name: should deny a write whose method only a shell that reads comments would drop
      shell: bash
      env:
        HOOK: ${{ inputs.hook }}
        PAYLOAD: '{"tool_name":"Bash","tool_input":{"command":"gh api repos/o/r/git/refs/heads/x # -X DELETE"}}'
        SENTENCE: >-
          `gh api` would send DELETE, which is not a read and can change GitHub
          state. Only GET and HEAD are allowed here.
      run: |
        decision=$(echo "$PAYLOAD" | "$HOOK")
        echo "$decision" | grep '"permissionDecision":"deny"'
        echo "$decision" | grep -F -- "$SENTENCE"

    - name: should deny a request that an unquoted command substitution could add a method to
      shell: bash
      env:
        HOOK: ${{ inputs.hook }}
        PAYLOAD: '{"tool_name":"Bash","tool_input":{"command":"gh api $(echo -X DELETE) repos/o/r/git/refs/heads/x"}}'
        SENTENCE: >-
          An argument of `gh api` contains an unquoted shell expansion or pattern
          ($(...)), which can turn into further arguments, so the request that
          would actually be sent cannot be determined. Quote it, or write the
          request out with literal values.
      run: |
        decision=$(echo "$PAYLOAD" | "$HOOK")
        echo "$decision" | grep '"permissionDecision":"deny"'
        echo "$decision" | grep -F -- "$SENTENCE"

    - name: should deny a request that a command substitution in backticks could add a method to
      shell: bash
      env:
        HOOK: ${{ inputs.hook }}
        PAYLOAD: '{"tool_name":"Bash","tool_input":{"command":"gh api `echo -X DELETE` repos/o/r/git/refs/heads/x"}}'
        SENTENCE: >-
          An argument of `gh api` contains an unquoted shell expansion or pattern
          ($(...)), which can turn into further arguments, so the request that
          would actually be sent cannot be determined. Quote it, or write the
          request out with literal values.
      run: |
        decision=$(echo "$PAYLOAD" | "$HOOK")
        echo "$decision" | grep '"permissionDecision":"deny"'
        echo "$decision" | grep -F -- "$SENTENCE"

    - name: should deny a write that a brace expansion unfolds into
      shell: bash
      env:
        HOOK: ${{ inputs.hook }}
        PAYLOAD: '{"tool_name":"Bash","tool_input":{"command":"gh api {-XDELETE,repos/o/r/git/refs/heads/x}"}}'
        SENTENCE: >-
          An argument of `gh api` contains an unquoted shell expansion or pattern
          ({-XDELETE,repos/o/r/git/refs/heads/x}), which can turn into further
          arguments, so the request that would actually be sent cannot be
          determined. Quote it, or write the request out with literal values.
      run: |
        decision=$(echo "$PAYLOAD" | "$HOOK")
        echo "$decision" | grep '"permissionDecision":"deny"'
        echo "$decision" | grep -F -- "$SENTENCE"

    - name: should deny a request that a filename pattern could add a method to
      shell: bash
      env:
        HOOK: ${{ inputs.hook }}
        PAYLOAD: '{"tool_name":"Bash","tool_input":{"command":"gh api repos/o/r/git/refs/heads/x -?DELETE"}}'
        SENTENCE: >-
          An argument of `gh api` contains an unquoted shell expansion or pattern
          (-?DELETE), which can turn into further arguments, so the request that
          would actually be sent cannot be determined. Quote it, or write the
          request out with literal values.
      run: |
        decision=$(echo "$PAYLOAD" | "$HOOK")
        echo "$decision" | grep '"permissionDecision":"deny"'
        echo "$decision" | grep -F -- "$SENTENCE"

    - name: should deny a write whose method follows a redirection
      shell: bash
      env:
        HOOK: ${{ inputs.hook }}
        PAYLOAD: '{"tool_name":"Bash","tool_input":{"command":"gh api repos/o/r/git/refs/heads/x > /dev/null -X DELETE"}}'
        SENTENCE: >-
          `gh api` would send DELETE, which is not a read and can change GitHub
          state. Only GET and HEAD are allowed here.
      run: |
        decision=$(echo "$PAYLOAD" | "$HOOK")
        echo "$decision" | grep '"permissionDecision":"deny"'
        echo "$decision" | grep -F -- "$SENTENCE"

    - name: should deny a write whose method follows a process substitution
      shell: bash
      env:
        HOOK: ${{ inputs.hook }}
        PAYLOAD: '{"tool_name":"Bash","tool_input":{"command":"gh api repos/o/r/git/refs/heads/x <(true) -X DELETE"}}'
        SENTENCE: >-
          An argument of `gh api` contains an unquoted shell expansion or pattern
          ($(...)), which can turn into further arguments, so the request that
          would actually be sent cannot be determined. Quote it, or write the
          request out with literal values.
      run: |
        decision=$(echo "$PAYLOAD" | "$HOOK")
        echo "$decision" | grep '"permissionDecision":"deny"'
        echo "$decision" | grep -F -- "$SENTENCE"

    - name: should deny a write that follows a redirection of its own
      shell: bash
      env:
        HOOK: ${{ inputs.hook }}
        PAYLOAD: '{"tool_name":"Bash","tool_input":{"command":"> /dev/null gh repo delete owner/name"}}'
        SENTENCE: >-
          `gh repo delete` is not on this hook's allow-list of gh subcommands that
          only read from GitHub, so it cannot be shown to leave GitHub unchanged.
          Read the data with a gh command that is on the list, or ask the user to
          run this one. If `gh repo delete` really only reads, the allow-list in
          claude-gh-admission-hook is what needs the entry.
      run: |
        decision=$(echo "$PAYLOAD" | "$HOOK")
        echo "$decision" | grep '"permissionDecision":"deny"'
        echo "$decision" | grep -F -- "$SENTENCE"

    - name: should deny a write behind env and a flag of env
      shell: bash
      env:
        HOOK: ${{ inputs.hook }}
        PAYLOAD: '{"tool_name":"Bash","tool_input":{"command":"env -i gh repo delete owner/name"}}'
        SENTENCE: >-
          `gh repo delete` is not on this hook's allow-list of gh subcommands that
          only read from GitHub, so it cannot be shown to leave GitHub unchanged.
          Read the data with a gh command that is on the list, or ask the user to
          run this one. If `gh repo delete` really only reads, the allow-list in
          claude-gh-admission-hook is what needs the entry.
      run: |
        decision=$(echo "$PAYLOAD" | "$HOOK")
        echo "$decision" | grep '"permissionDecision":"deny"'
        echo "$decision" | grep -F -- "$SENTENCE"

    - name: should deny a write behind sudo and a flag of sudo
      shell: bash
      env:
        HOOK: ${{ inputs.hook }}
        PAYLOAD: '{"tool_name":"Bash","tool_input":{"command":"sudo -n gh repo delete owner/name"}}'
        SENTENCE: >-
          `gh repo delete` is not on this hook's allow-list of gh subcommands that
          only read from GitHub, so it cannot be shown to leave GitHub unchanged.
          Read the data with a gh command that is on the list, or ask the user to
          run this one. If `gh repo delete` really only reads, the allow-list in
          claude-gh-admission-hook is what needs the entry.
      run: |
        decision=$(echo "$PAYLOAD" | "$HOOK")
        echo "$decision" | grep '"permissionDecision":"deny"'
        echo "$decision" | grep -F -- "$SENTENCE"

    - name: should deny a write behind a wrapper whose flag takes the name of another command
      shell: bash
      env:
        HOOK: ${{ inputs.hook }}
        PAYLOAD: '{"tool_name":"Bash","tool_input":{"command":"env -u git gh repo delete owner/name"}}'
        SENTENCE: >-
          `gh repo delete` is not on this hook's allow-list of gh subcommands that
          only read from GitHub, so it cannot be shown to leave GitHub unchanged.
          Read the data with a gh command that is on the list, or ask the user to
          run this one. If `gh repo delete` really only reads, the allow-list in
          claude-gh-admission-hook is what needs the entry.
      run: |
        decision=$(echo "$PAYLOAD" | "$HOOK")
        echo "$decision" | grep '"permissionDecision":"deny"'
        echo "$decision" | grep -F -- "$SENTENCE"

    - name: should deny a write that a flag ahead of the subcommand makes look like a read
      shell: bash
      env:
        HOOK: ${{ inputs.hook }}
        PAYLOAD: '{"tool_name":"Bash","tool_input":{"command":"gh pr --subject view merge 5"}}'
        SENTENCE: >-
          `gh pr merge` is not on this hook's allow-list of gh subcommands that
          only read from GitHub, so it cannot be shown to leave GitHub unchanged.
          Read the data with a gh command that is on the list, or ask the user to
          run this one. If `gh pr merge` really only reads, the allow-list in
          claude-gh-admission-hook is what needs the entry.
      run: |
        decision=$(echo "$PAYLOAD" | "$HOOK")
        echo "$decision" | grep '"permissionDecision":"deny"'
        echo "$decision" | grep -F -- "$SENTENCE"

    - name: should deny when an expansion ahead of the subcommand could name another one
      shell: bash
      env:
        HOOK: ${{ inputs.hook }}
        PAYLOAD: '{"tool_name":"Bash","tool_input":{"command":"gh -R $REPO pr view 5"}}'
        SENTENCE: >-
          $REPO comes before the end of the gh subcommand and contains a shell
          expansion or pattern, so which subcommand gh would run cannot be
          determined. Write the subcommand out literally, and put the flags after
          it.
      run: |
        decision=$(echo "$PAYLOAD" | "$HOOK")
        echo "$decision" | grep '"permissionDecision":"deny"'
        echo "$decision" | grep -F -- "$SENTENCE"

    - name: should deny changing the visibility of a codespace port
      shell: bash
      env:
        HOOK: ${{ inputs.hook }}
        PAYLOAD: '{"tool_name":"Bash","tool_input":{"command":"gh codespace ports visibility 80:public"}}'
        SENTENCE: >-
          `gh codespace ports visibility` is not on this hook's allow-list of gh
          subcommands that only read from GitHub, so it cannot be shown to leave
          GitHub unchanged. Read the data with a gh command that is on the list,
          or ask the user to run this one. If `gh codespace ports visibility`
          really only reads, the allow-list in claude-gh-admission-hook is what
          needs the entry.
      run: |
        decision=$(echo "$PAYLOAD" | "$HOOK")
        echo "$decision" | grep '"permissionDecision":"deny"'
        echo "$decision" | grep -F -- "$SENTENCE"

    - name: should deny forwarding a codespace port
      shell: bash
      env:
        HOOK: ${{ inputs.hook }}
        PAYLOAD: '{"tool_name":"Bash","tool_input":{"command":"gh codespace ports forward 80:80"}}'
        SENTENCE: >-
          `gh codespace ports forward` is not on this hook's allow-list of gh
          subcommands that only read from GitHub, so it cannot be shown to leave
          GitHub unchanged. Read the data with a gh command that is on the list,
          or ask the user to run this one. If `gh codespace ports forward` really
          only reads, the allow-list in claude-gh-admission-hook is what needs the
          entry.
      run: |
        decision=$(echo "$PAYLOAD" | "$HOOK")
        echo "$decision" | grep '"permissionDecision":"deny"'
        echo "$decision" | grep -F -- "$SENTENCE"

    - name: should deny a write that follows the creation of a draft pull request
      shell: bash
      env:
        HOOK: ${{ inputs.hook }}
        PAYLOAD: '{"tool_name":"Bash","tool_input":{"command":"gh pr create --draft --title x && gh pr merge 5"}}'
        SENTENCE: >-
          `gh pr merge` is not on this hook's allow-list of gh subcommands that
          only read from GitHub, so it cannot be shown to leave GitHub unchanged.
          Read the data with a gh command that is on the list, or ask the user to
          run this one. If `gh pr merge` really only reads, the allow-list in
          claude-gh-admission-hook is what needs the entry.
      run: |
        decision=$(echo "$PAYLOAD" | "$HOOK")
        echo "$decision" | grep '"permissionDecision":"deny"'
        echo "$decision" | grep -F -- "$SENTENCE"

    - name: should deny a request that a quoted expansion could add a method to
      shell: bash
      env:
        HOOK: ${{ inputs.hook }}
        PAYLOAD: '{"tool_name":"Bash","tool_input":{"command":"gh api repos/o/r/git/refs/heads/x \"$FLAG\""}}'
        SENTENCE: >-
          An argument of `gh api` (\"$FLAG\") comes out of a shell expansion and
          is not the value of a flag, so it could turn out to be a flag that
          changes the request. Start it with literal text, or write it out
          literally.
      run: |
        decision=$(echo "$PAYLOAD" | "$HOOK")
        echo "$decision" | grep '"permissionDecision":"deny"'
        echo "$decision" | grep -F -- "$SENTENCE"

    - name: should deny a GraphQL query that comes out of a shell expansion
      shell: bash
      env:
        HOOK: ${{ inputs.hook }}
        PAYLOAD: '{"tool_name":"Bash","tool_input":{"command":"gh api graphql -f query=\"$QUERY\""}}'
        SENTENCE: >-
          A field of `gh api graphql` comes out of a shell expansion and could be
          the query, so the query cannot be shown to be free of mutations. Write
          the query out literally, and pass what varies as a GraphQL variable with
          -F.
      run: |
        decision=$(echo "$PAYLOAD" | "$HOOK")
        echo "$decision" | grep '"permissionDecision":"deny"'
        echo "$decision" | grep -F -- "$SENTENCE"

    - name: should deny a GraphQL field that a shell expansion could make the query
      shell: bash
      env:
        HOOK: ${{ inputs.hook }}
        PAYLOAD: '{"tool_name":"Bash","tool_input":{"command":"gh api graphql -f query=query{viewer{login}} -f \"$FIELD\""}}'
        SENTENCE: >-
          A field of `gh api graphql` comes out of a shell expansion and could be
          the query, so the query cannot be shown to be free of mutations. Write
          the query out literally, and pass what varies as a GraphQL variable with
          -F.
      run: |
        decision=$(echo "$PAYLOAD" | "$HOOK")
        echo "$decision" | grep '"permissionDecision":"deny"'
        echo "$decision" | grep -F -- "$SENTENCE"

    - name: should deny a group of subcommands that xargs could complete into a write
      shell: bash
      env:
        HOOK: ${{ inputs.hook }}
        PAYLOAD: '{"tool_name":"Bash","tool_input":{"command":"echo merge 5 | xargs gh pr"}}'
        SENTENCE: >-
          This gh command is run through xargs or parallel, which adds arguments
          that this hook cannot see, and they could turn it into a write. Give gh
          all of its arguments on the command line itself.
      run: |
        decision=$(echo "$PAYLOAD" | "$HOOK")
        echo "$decision" | grep '"permissionDecision":"deny"'
        echo "$decision" | grep -F -- "$SENTENCE"

    - name: should deny a request that xargs could add a method to
      shell: bash
      env:
        HOOK: ${{ inputs.hook }}
        PAYLOAD: '{"tool_name":"Bash","tool_input":{"command":"echo -X DELETE | xargs gh api repos/o/r/git/refs/heads/x"}}'
        SENTENCE: >-
          This gh command is run through xargs or parallel, which adds arguments
          that this hook cannot see, and they could turn it into a write. Give gh
          all of its arguments on the command line itself.
      run: |
        decision=$(echo "$PAYLOAD" | "$HOOK")
        echo "$decision" | grep '"permissionDecision":"deny"'
        echo "$decision" | grep -F -- "$SENTENCE"

    - name: should deny a group of subcommands that parallel could complete into a write
      shell: bash
      env:
        HOOK: ${{ inputs.hook }}
        PAYLOAD: '{"tool_name":"Bash","tool_input":{"command":"echo merge 5 | parallel gh pr"}}'
        SENTENCE: >-
          This gh command is run through xargs or parallel, which adds arguments
          that this hook cannot see, and they could turn it into a write. Give gh
          all of its arguments on the command line itself.
      run: |
        decision=$(echo "$PAYLOAD" | "$HOOK")
        echo "$decision" | grep '"permissionDecision":"deny"'
        echo "$decision" | grep -F -- "$SENTENCE"
