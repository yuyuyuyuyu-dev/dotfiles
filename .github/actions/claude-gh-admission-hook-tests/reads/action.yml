name: should let reads through
description: Tests of claude-gh-admission-hook.

inputs:
  hook:
    description: The claude-gh-admission-hook executable to run the payloads through.
    required: true

runs:
  using: composite
  steps:
    - name: should let pull requests be listed
      shell: bash
      env:
        HOOK: ${{ inputs.hook }}
        PAYLOAD: '{"tool_name":"Bash","tool_input":{"command":"gh pr list"}}'
      run: |
        decision=$(echo "$PAYLOAD" | "$HOOK")
        test -z "$decision" || { echo "expected no decision, got: $decision"; exit 1; }

    - name: should let a pull request be read
      shell: bash
      env:
        HOOK: ${{ inputs.hook }}
        PAYLOAD: '{"tool_name":"Bash","tool_input":{"command":"gh pr view 5"}}'
      run: |
        decision=$(echo "$PAYLOAD" | "$HOOK")
        test -z "$decision" || { echo "expected no decision, got: $decision"; exit 1; }

    - name: should let the diff of a pull request be read
      shell: bash
      env:
        HOOK: ${{ inputs.hook }}
        PAYLOAD: '{"tool_name":"Bash","tool_input":{"command":"gh pr diff 5"}}'
      run: |
        decision=$(echo "$PAYLOAD" | "$HOOK")
        test -z "$decision" || { echo "expected no decision, got: $decision"; exit 1; }

    - name: should let an issue be read
      shell: bash
      env:
        HOOK: ${{ inputs.hook }}
        PAYLOAD: '{"tool_name":"Bash","tool_input":{"command":"gh issue view 12"}}'
      run: |
        decision=$(echo "$PAYLOAD" | "$HOOK")
        test -z "$decision" || { echo "expected no decision, got: $decision"; exit 1; }

    - name: should let a repository be read
      shell: bash
      env:
        HOOK: ${{ inputs.hook }}
        PAYLOAD: '{"tool_name":"Bash","tool_input":{"command":"gh repo view"}}'
      run: |
        decision=$(echo "$PAYLOAD" | "$HOOK")
        test -z "$decision" || { echo "expected no decision, got: $decision"; exit 1; }

    - name: should let releases be listed
      shell: bash
      env:
        HOOK: ${{ inputs.hook }}
        PAYLOAD: '{"tool_name":"Bash","tool_input":{"command":"gh release list"}}'
      run: |
        decision=$(echo "$PAYLOAD" | "$HOOK")
        test -z "$decision" || { echo "expected no decision, got: $decision"; exit 1; }

    - name: should let a workflow run be read
      shell: bash
      env:
        HOOK: ${{ inputs.hook }}
        PAYLOAD: '{"tool_name":"Bash","tool_input":{"command":"gh run view 123"}}'
      run: |
        decision=$(echo "$PAYLOAD" | "$HOOK")
        test -z "$decision" || { echo "expected no decision, got: $decision"; exit 1; }

    - name: should let the REST API be read
      shell: bash
      env:
        HOOK: ${{ inputs.hook }}
        PAYLOAD: '{"tool_name":"Bash","tool_input":{"command":"gh api /repos/o/r/issues"}}'
      run: |
        decision=$(echo "$PAYLOAD" | "$HOOK")
        test -z "$decision" || { echo "expected no decision, got: $decision"; exit 1; }

    - name: should let a GraphQL query be sent
      shell: bash
      env:
        HOOK: ${{ inputs.hook }}
        PAYLOAD: '{"tool_name":"Bash","tool_input":{"command":"gh api graphql -f query=query{viewer{login}}"}}'
      run: |
        decision=$(echo "$PAYLOAD" | "$HOOK")
        test -z "$decision" || { echo "expected no decision, got: $decision"; exit 1; }

    - name: should let tags be listed
      shell: bash
      env:
        HOOK: ${{ inputs.hook }}
        PAYLOAD: '{"tool_name":"Bash","tool_input":{"command":"git tag -l"}}'
      run: |
        decision=$(echo "$PAYLOAD" | "$HOOK")
        test -z "$decision" || { echo "expected no decision, got: $decision"; exit 1; }

    - name: should let a branch be pushed
      shell: bash
      env:
        HOOK: ${{ inputs.hook }}
        PAYLOAD: '{"tool_name":"Bash","tool_input":{"command":"git push origin HEAD"}}'
      run: |
        decision=$(echo "$PAYLOAD" | "$HOOK")
        test -z "$decision" || { echo "expected no decision, got: $decision"; exit 1; }

    - name: should let the API be read with curl
      shell: bash
      env:
        HOOK: ${{ inputs.hook }}
        PAYLOAD: '{"tool_name":"Bash","tool_input":{"command":"curl -q https://api.github.com/repos/o/r"}}'
      run: |
        decision=$(echo "$PAYLOAD" | "$HOOK")
        test -z "$decision" || { echo "expected no decision, got: $decision"; exit 1; }

    - name: should let the ports of a codespace be listed
      shell: bash
      env:
        HOOK: ${{ inputs.hook }}
        PAYLOAD: '{"tool_name":"Bash","tool_input":{"command":"gh codespace ports"}}'
      run: |
        decision=$(echo "$PAYLOAD" | "$HOOK")
        test -z "$decision" || { echo "expected no decision, got: $decision"; exit 1; }

    - name: should let a read through when a comment with an apostrophe follows it
      shell: bash
      env:
        HOOK: ${{ inputs.hook }}
        PAYLOAD: '{"tool_name":"Bash","tool_input":{"command":"gh pr list # don''t merge yet"}}'
      run: |
        decision=$(echo "$PAYLOAD" | "$HOOK")
        test -z "$decision" || { echo "expected no decision, got: $decision"; exit 1; }

    - name: should let a read through xargs when its subcommand is complete
      shell: bash
      env:
        HOOK: ${{ inputs.hook }}
        PAYLOAD: '{"tool_name":"Bash","tool_input":{"command":"echo 5 | xargs gh pr view"}}'
      run: |
        decision=$(echo "$PAYLOAD" | "$HOOK")
        test -z "$decision" || { echo "expected no decision, got: $decision"; exit 1; }

    - name: should let a request through when an expansion follows literal text
      shell: bash
      env:
        HOOK: ${{ inputs.hook }}
        PAYLOAD: '{"tool_name":"Bash","tool_input":{"command":"gh api \"repos/$OWNER/$REPO/pulls\""}}'
      run: |
        decision=$(echo "$PAYLOAD" | "$HOOK")
        test -z "$decision" || { echo "expected no decision, got: $decision"; exit 1; }

    - name: should let tags be listed when an expansion is given as --flag=value
      shell: bash
      env:
        HOOK: ${{ inputs.hook }}
        PAYLOAD: '{"tool_name":"Bash","tool_input":{"command":"git tag --contains=\"$COMMIT\""}}'
      run: |
        decision=$(echo "$PAYLOAD" | "$HOOK")
        test -z "$decision" || { echo "expected no decision, got: $decision"; exit 1; }

    - name: should let files be added through xargs
      shell: bash
      env:
        HOOK: ${{ inputs.hook }}
        PAYLOAD: '{"tool_name":"Bash","tool_input":{"command":"git ls-files | xargs git add"}}'
      run: |
        decision=$(echo "$PAYLOAD" | "$HOOK")
        test -z "$decision" || { echo "expected no decision, got: $decision"; exit 1; }

    - name: should let a request to the GitHub API through when a header comes out of a quoted expansion
      shell: bash
      env:
        HOOK: ${{ inputs.hook }}
        PAYLOAD: '{"tool_name":"Bash","tool_input":{"command":"curl -q -s -H \"$AUTH\" https://api.github.com/repos/o/r"}}'
      run: |
        decision=$(echo "$PAYLOAD" | "$HOOK")
        test -z "$decision" || { echo "expected no decision, got: $decision"; exit 1; }

    - name: should let a branch be pushed by its full name
      shell: bash
      env:
        HOOK: ${{ inputs.hook }}
        PAYLOAD: '{"tool_name":"Bash","tool_input":{"command":"git push origin refs/heads/main"}}'
      run: |
        decision=$(echo "$PAYLOAD" | "$HOOK")
        test -z "$decision" || { echo "expected no decision, got: $decision"; exit 1; }

    - name: should let a branch be pushed to a branch named in full
      shell: bash
      env:
        HOOK: ${{ inputs.hook }}
        PAYLOAD: '{"tool_name":"Bash","tool_input":{"command":"git push -u origin feature/x:refs/heads/feature/x"}}'
      run: |
        decision=$(echo "$PAYLOAD" | "$HOOK")
        test -z "$decision" || { echo "expected no decision, got: $decision"; exit 1; }

    - name: should let a branch be pushed when a push option comes before the remote
      shell: bash
      env:
        HOOK: ${{ inputs.hook }}
        PAYLOAD: '{"tool_name":"Bash","tool_input":{"command":"git push -o ci.skip origin HEAD"}}'
      run: |
        decision=$(echo "$PAYLOAD" | "$HOOK")
        test -z "$decision" || { echo "expected no decision, got: $decision"; exit 1; }

    - name: should let a branch be pushed when the git configuration keeps tags from following
      shell: bash
      env:
        HOOK: ${{ inputs.hook }}
        GIT_CONFIG_GLOBAL: /dev/null
        GIT_CONFIG_NOSYSTEM: "1"
        PAYLOAD: '{"tool_name":"Bash","tool_input":{"command":"git push origin HEAD"}}'
      run: |
        cd "$(mktemp -d)"
        git init --quiet
        git config push.followTags 'false'
        decision=$(echo "$PAYLOAD" | "$HOOK")
        test -z "$decision" || { echo "expected no decision, got: $decision"; exit 1; }

    - name: should let a push that names nothing through when the git configuration makes that a branch refspec
      shell: bash
      env:
        HOOK: ${{ inputs.hook }}
        GIT_CONFIG_GLOBAL: /dev/null
        GIT_CONFIG_NOSYSTEM: "1"
        PAYLOAD: '{"tool_name":"Bash","tool_input":{"command":"git push"}}'
      run: |
        cd "$(mktemp -d)"
        git init --quiet
        git config remote.origin.url 'https://github.com/owner/repo'
        git config remote.origin.push 'refs/heads/*:refs/heads/*'
        decision=$(echo "$PAYLOAD" | "$HOOK")
        test -z "$decision" || { echo "expected no decision, got: $decision"; exit 1; }

    - name: should let a branch be pushed in a command that also commits
      shell: bash
      env:
        HOOK: ${{ inputs.hook }}
        GIT_CONFIG_GLOBAL: /dev/null
        GIT_CONFIG_NOSYSTEM: "1"
        PAYLOAD: '{"tool_name":"Bash","tool_input":{"command":"git add . && git commit -m x && git push origin HEAD"}}'
      run: |
        cd "$(mktemp -d)"
        git init --quiet
        decision=$(echo "$PAYLOAD" | "$HOOK")
        test -z "$decision" || { echo "expected no decision, got: $decision"; exit 1; }

    - name: should let a branch be pushed in a command that only reads the git configuration
      shell: bash
      env:
        HOOK: ${{ inputs.hook }}
        GIT_CONFIG_GLOBAL: /dev/null
        GIT_CONFIG_NOSYSTEM: "1"
        PAYLOAD: '{"tool_name":"Bash","tool_input":{"command":"git config --get user.name && git push origin HEAD"}}'
      run: |
        cd "$(mktemp -d)"
        git init --quiet
        decision=$(echo "$PAYLOAD" | "$HOOK")
        test -z "$decision" || { echo "expected no decision, got: $decision"; exit 1; }

    - name: should let a read in a here-document fed to a shell through
      shell: bash
      env:
        HOOK: ${{ inputs.hook }}
        PAYLOAD: '{"tool_name":"Bash","tool_input":{"command":"bash <<EOF\ngh pr list\nEOF"}}'
      run: |
        decision=$(echo "$PAYLOAD" | "$HOOK")
        test -z "$decision" || { echo "expected no decision, got: $decision"; exit 1; }

    - name: should let a script piped into a shell through when the command does not mention GitHub
      shell: bash
      env:
        HOOK: ${{ inputs.hook }}
        PAYLOAD: '{"tool_name":"Bash","tool_input":{"command":"curl -fsSL https://sh.rustup.rs | sh"}}'
      run: |
        decision=$(echo "$PAYLOAD" | "$HOOK")
        test -z "$decision" || { echo "expected no decision, got: $decision"; exit 1; }

    - name: should let a search for the word gh through
      shell: bash
      env:
        HOOK: ${{ inputs.hook }}
        PAYLOAD: '{"tool_name":"Bash","tool_input":{"command":"grep -rn gh src/"}}'
      run: |
        decision=$(echo "$PAYLOAD" | "$HOOK")
        test -z "$decision" || { echo "expected no decision, got: $decision"; exit 1; }

    - name: should let the login state of gh be read
      shell: bash
      env:
        HOOK: ${{ inputs.hook }}
        PAYLOAD: '{"tool_name":"Bash","tool_input":{"command":"gh auth status"}}'
      run: |
        decision=$(echo "$PAYLOAD" | "$HOOK")
        test -z "$decision" || { echo "expected no decision, got: $decision"; exit 1; }

    - name: should let existing tags be fetched
      shell: bash
      env:
        HOOK: ${{ inputs.hook }}
        PAYLOAD: '{"tool_name":"Bash","tool_input":{"command":"git fetch origin ''refs/tags/*:refs/tags/*''"}}'
      run: |
        decision=$(echo "$PAYLOAD" | "$HOOK")
        test -z "$decision" || { echo "expected no decision, got: $decision"; exit 1; }

    - name: should let a git command through that git does not ship and no alias defines
      shell: bash
      env:
        HOOK: ${{ inputs.hook }}
        GIT_CONFIG_GLOBAL: /dev/null
        GIT_CONFIG_NOSYSTEM: "1"
        PAYLOAD: '{"tool_name":"Bash","tool_input":{"command":"git lfs ls-files"}}'
      run: |
        cd "$(mktemp -d)"
        git init --quiet
        decision=$(echo "$PAYLOAD" | "$HOOK")
        test -z "$decision" || { echo "expected no decision, got: $decision"; exit 1; }

    - name: should let the API be read with wget
      shell: bash
      env:
        HOOK: ${{ inputs.hook }}
        PAYLOAD: '{"tool_name":"Bash","tool_input":{"command":"wget --no-config https://api.github.com/repos/o/r"}}'
      run: |
        decision=$(echo "$PAYLOAD" | "$HOOK")
        test -z "$decision" || { echo "expected no decision, got: $decision"; exit 1; }

    - name: should let a here-document that mentions a write be written to a file
      shell: bash
      env:
        HOOK: ${{ inputs.hook }}
        PAYLOAD: '{"tool_name":"Bash","tool_input":{"command":"cat <<EOF > notes.md\ngh pr merge 5\nEOF"}}'
      run: |
        decision=$(echo "$PAYLOAD" | "$HOOK")
        test -z "$decision" || { echo "expected no decision, got: $decision"; exit 1; }

    - name: should let a commit through whose message is a here-document that mentions a write
      shell: bash
      env:
        HOOK: ${{ inputs.hook }}
        PAYLOAD: '{"tool_name":"Bash","tool_input":{"command":"git commit -m \"$(cat <<''EOF''\nfix: don''t run gh pr merge (ever)\nEOF\n)\""}}'
      run: |
        decision=$(echo "$PAYLOAD" | "$HOOK")
        test -z "$decision" || { echo "expected no decision, got: $decision"; exit 1; }

    - name: should let tags be listed in an order
      shell: bash
      env:
        HOOK: ${{ inputs.hook }}
        PAYLOAD: '{"tool_name":"Bash","tool_input":{"command":"git tag --sort=refname"}}'
      run: |
        decision=$(echo "$PAYLOAD" | "$HOOK")
        test -z "$decision" || { echo "expected no decision, got: $decision"; exit 1; }

    - name: should let the API be read with curl and flags this hook knows
      shell: bash
      env:
        HOOK: ${{ inputs.hook }}
        PAYLOAD: '{"tool_name":"Bash","tool_input":{"command":"curl -q -sSL -H \"Accept: application/vnd.github+json\" https://api.github.com/repos/o/r"}}'
      run: |
        decision=$(echo "$PAYLOAD" | "$HOOK")
        test -z "$decision" || { echo "expected no decision, got: $decision"; exit 1; }

    - name: should let a branch be pushed in a command that reads one git setting
      shell: bash
      env:
        HOOK: ${{ inputs.hook }}
        GIT_CONFIG_GLOBAL: /dev/null
        GIT_CONFIG_NOSYSTEM: "1"
        PAYLOAD: '{"tool_name":"Bash","tool_input":{"command":"git config user.name && git push origin HEAD"}}'
      run: |
        cd "$(mktemp -d)"
        git init --quiet
        decision=$(echo "$PAYLOAD" | "$HOOK")
        test -z "$decision" || { echo "expected no decision, got: $decision"; exit 1; }

    - name: should let a branch be pushed after a commit whose message names a git configuration file
      shell: bash
      env:
        HOOK: ${{ inputs.hook }}
        GIT_CONFIG_GLOBAL: /dev/null
        GIT_CONFIG_NOSYSTEM: "1"
        PAYLOAD: '{"tool_name":"Bash","tool_input":{"command":"git commit -m \"update gitconfig\" && git push origin HEAD"}}'
      run: |
        cd "$(mktemp -d)"
        git init --quiet
        decision=$(echo "$PAYLOAD" | "$HOOK")
        test -z "$decision" || { echo "expected no decision, got: $decision"; exit 1; }

    - name: should let a here-document with tabs stripped be written to a file
      shell: bash
      env:
        HOOK: ${{ inputs.hook }}
        PAYLOAD: '{"tool_name":"Bash","tool_input":{"command":"cat <<-EOF > notes.md\n\tgh pr merge 5\n\tEOF"}}'
      run: |
        decision=$(echo "$PAYLOAD" | "$HOOK")
        test -z "$decision" || { echo "expected no decision, got: $decision"; exit 1; }

    - name: should let a here-document follow a case inside a substitution
      shell: bash
      env:
        HOOK: ${{ inputs.hook }}
        PAYLOAD: '{"tool_name":"Bash","tool_input":{"command":"result=$(case x in x) echo y;; esac); cat <<EOF\ngh pr merge 5\nEOF"}}'
      run: |
        decision=$(echo "$PAYLOAD" | "$HOOK")
        test -z "$decision" || { echo "expected no decision, got: $decision"; exit 1; }

    - name: should let a tool without a command through
      shell: bash
      env:
        HOOK: ${{ inputs.hook }}
        PAYLOAD: '{"tool_name":"Read","tool_input":{"file_path":"/tmp/x"}}'
      run: |
        decision=$(echo "$PAYLOAD" | "$HOOK")
        test -z "$decision" || { echo "expected no decision, got: $decision"; exit 1; }

    - name: should let the desktop app read the pull request bound to a session
      shell: bash
      env:
        HOOK: ${{ inputs.hook }}
        PAYLOAD: '{"tool_name":"mcp__ccd_pr__get_status","tool_input":{}}'
      run: |
        decision=$(echo "$PAYLOAD" | "$HOOK")
        test -z "$decision" || { echo "expected no decision, got: $decision"; exit 1; }

    - name: should let the desktop app bind a pull request to a session
      shell: bash
      env:
        HOOK: ${{ inputs.hook }}
        PAYLOAD: '{"tool_name":"mcp__ccd_pr__bind_pr","tool_input":{"url":"https://github.com/o/r/pull/5"}}'
      run: |
        decision=$(echo "$PAYLOAD" | "$HOOK")
        test -z "$decision" || { echo "expected no decision, got: $decision"; exit 1; }

    - name: should let the desktop app unbind a pull request from a session
      shell: bash
      env:
        HOOK: ${{ inputs.hook }}
        PAYLOAD: '{"tool_name":"mcp__ccd_pr__unbind_pr","tool_input":{"url":"https://github.com/o/r/pull/5"}}'
      run: |
        decision=$(echo "$PAYLOAD" | "$HOOK")
        test -z "$decision" || { echo "expected no decision, got: $decision"; exit 1; }

    - name: should let the desktop app switch how it watches the CI of a pull request
      shell: bash
      env:
        HOOK: ${{ inputs.hook }}
        PAYLOAD: '{"tool_name":"mcp__ccd_pr__set_monitor","tool_input":{"url":"https://github.com/o/r/pull/5","auto_fix":true}}'
      run: |
        decision=$(echo "$PAYLOAD" | "$HOOK")
        test -z "$decision" || { echo "expected no decision, got: $decision"; exit 1; }

    - name: should let a read that a tool other than Bash runs through
      shell: bash
      env:
        HOOK: ${{ inputs.hook }}
        PAYLOAD: '{"tool_name":"Monitor","tool_input":{"command":"gh pr checks 5","description":"x","timeout_ms":1000}}'
      run: |
        decision=$(echo "$PAYLOAD" | "$HOOK")
        test -z "$decision" || { echo "expected no decision, got: $decision"; exit 1; }
