name: github-guard asks before creating a pull request, as an exception
description: >-
  Creating a pull request is a write, and the one write this guard exists to
  permit. It has to reach the user as a prompt: neither denied outright, nor
  waved through without anyone seeing it.

inputs:
  guard:
    description: The github-guard executable to run the payloads through.
    required: true

runs:
  using: composite
  steps:
    - name: should ask before creating a pull request
      shell: bash
      env:
        GUARD: ${{ inputs.guard }}
        PAYLOAD: '{"tool_name":"Bash","tool_input":{"command":"gh pr create --title x --body y"}}'
      run: echo "$PAYLOAD" | "$GUARD" | grep '"permissionDecision":"ask"'

    - name: should ask when the pull request is created without arguments
      shell: bash
      env:
        GUARD: ${{ inputs.guard }}
        PAYLOAD: '{"tool_name":"Bash","tool_input":{"command":"gh pr create"}}'
      run: echo "$PAYLOAD" | "$GUARD" | grep '"permissionDecision":"ask"'

    - name: should ask when the creation is hidden in a nested shell
      shell: bash
      env:
        GUARD: ${{ inputs.guard }}
        PAYLOAD: '{"tool_name":"Bash","tool_input":{"command":"bash -c \"gh pr create --title x\""}}'
      run: echo "$PAYLOAD" | "$GUARD" | grep '"permissionDecision":"ask"'

    - name: should ask when the repository is named before the subcommand
      shell: bash
      env:
        GUARD: ${{ inputs.guard }}
        PAYLOAD: '{"tool_name":"Bash","tool_input":{"command":"gh -R owner/repo pr create --title x"}}'
      run: echo "$PAYLOAD" | "$GUARD" | grep '"permissionDecision":"ask"'

    # Stated on its own because asking and denying are both a decision, and a
    # regression that turned one into the other would still be a decision.
    - name: should not deny creating a pull request
      shell: bash
      env:
        GUARD: ${{ inputs.guard }}
        PAYLOAD: '{"tool_name":"Bash","tool_input":{"command":"gh pr create --title x --body y"}}'
      run: |
        decision=$(echo "$PAYLOAD" | "$GUARD")
        case "$decision" in
          *'"permissionDecision":"deny"'*)
            echo "expected an ask, got a denial: $decision"; exit 1 ;;
        esac

    # And stated on its own because saying nothing is the other way this could
    # go wrong: the command would run with nobody asked.
    - name: should not let the creation through without asking
      shell: bash
      env:
        GUARD: ${{ inputs.guard }}
        PAYLOAD: '{"tool_name":"Bash","tool_input":{"command":"gh pr create --title x --body y"}}'
      run: |
        decision=$(echo "$PAYLOAD" | "$GUARD")
        test -n "$decision" || { echo "expected an ask, got no decision at all"; exit 1; }
