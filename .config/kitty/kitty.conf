font_size   20.0

macos_option_as_alt yes

map Shift+Ctrl+j scroll_end
map Shift+Ctrl+; scroll_end

map cmd+t new_tab_with_cwd

mouse_hide_wait 2.0

# BEGIN_KITTY_THEME
# Gruvbox Material Light Medium
include current-theme.conf
# END_KITTY_THEME

# BEGIN_KITTY_FONTS
font_family      family="Yomogi Nerd Font Mono"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS
