# This repository is not a distributable package; the file exists so that uv can
# pin the version of ruff, and so that ruff's own settings sit alongside it.
[project]
name = "dotfiles"
version = "0"
# The python3 bundled with macOS is 3.9, and the deploy scripts have to run there.
requires-python = ">=3.9"

[tool.uv]
package = false

[dependency-groups]
# The single source for the ruff version. uv.lock holds the resolved result, and
# CI runs ruff through uv, so the version cannot drift between here and CI.
dev = ["ruff==0.16.1"]

[tool.ruff]
# Matches requires-python above: reject suggestions that only parse on a newer
# version than the oldest interpreter these scripts run on.
target-version = "py39"

[tool.ruff.lint]
# ruff's default rule set shifts between releases, so upgrading ruff alone could
# turn CI red. State what is enforced here instead of inheriting it.
select = ["F", "E", "W", "I", "UP", "B", "SIM", "BLE", "EXE", "PLW", "RUF"]

ignore = [
    # Line length is the formatter's job. All that reaches the linter is the
    # string literals the formatter cannot split, which would be permanent noise.
    "E501",
    # These flag the full-width parentheses of Japanese text as mistyped ASCII.
    # The comments and docstrings in this repository are written in Japanese,
    # where those characters are correct.
    # RUF001 = string literals, RUF002 = docstrings, RUF003 = comments.
    "RUF001",
    "RUF002",
    "RUF003",
]
